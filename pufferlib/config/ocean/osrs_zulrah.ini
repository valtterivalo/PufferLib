# Config for OSRS Zulrah encounter.
# 6 action heads (41 logits), 81 obs + 41 mask = 122 total, medium episodes (~600 ticks max).

[base]
env_name = osrs_zulrah
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
mask_in_obs = 1.0
gear_tier = 2.0

[vec]
total_agents = 512
num_buffers = 2

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 500000000
horizon = 32
learning_rate = 0.003
beta1 = 0.95
eps = 0.00001
ent_coef = 0.01
gamma = 0.999
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 1.0
replay_ratio = 0.25
minibatch_size = 4096
