# CUDA config for OSRS Inferno encounter.
# 8 action heads (79 logits), 1017 obs, long episodes (300-2000+ ticks).
# anchor hypers match Metal sweep trial #20.

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 4

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 800000000
horizon = 32
min_lr_ratio = 0.3
learning_rate = 0.000709
beta1 = 0.94384
eps = 0.000021
ent_coef = 0.009691
gamma = 0.999145
gae_lambda = 0.896231
vtrace_rho_clip = 3.0
vtrace_c_clip = 1.590846
prio_alpha = 0.625264
prio_beta0 = 0.412056
clip_coef = 1.0
vf_coef = 0.034905
vf_clip_coef = 0.536097
max_grad_norm = 1.892399
replay_ratio = 0.912406
minibatch_size = 8192
ns_iters = 5
weight_decay = 0.185295

[sweep]
min_sps = 50000
max_suggestion_cost = 3600
metric = episode_return
metric_distribution = linear

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.3
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.8
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 1.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.005
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.train.weight_decay]
distribution = log_normal
min = 0.001
max = 0.5
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.0
scale = auto
