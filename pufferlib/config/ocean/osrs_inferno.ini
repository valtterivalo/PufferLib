# upstream CUDA config for OSRS Inferno encounter.
# 7 action heads (76 logits), 381+76 obs, long episodes (300-2000+ ticks).
# sweep ranges recentered after edge analysis (47 trials, 2026-03-22).

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent

[vec]
total_agents = 4096
num_buffers = 4

[policy]
hidden_size = 128
num_layers = 2

[env]
start_wave = 0.0
mask_in_obs = 1.0
wave_reward_base = 0.001
wave_reward_scale = 1.1
brew_penalty = 0.03
brew_penalty_midpoint = 35.0
brew_penalty_width = 5.0
blood_heal_reward = 0.01
prayer_reward = 0.005

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.003
gamma = 0.9999
gae_lambda = 0.97
replay_ratio = 0.25
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 1.5
ent_coef = 0.005
horizon = 64
minibatch_size = 8192
min_lr_ratio = 0.1
weight_decay = 0.01

[sweep]
metric = episode_return
max_suggestion_cost = 1800
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 1500000000
max = 5000000000
scale = time

# --- model architecture ---
# default (hs=128 L=2) is near min — explore bigger models

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 5
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 2
max = 8
scale = auto

# --- core PPO hyperparams ---
# gamma FIXED at 0.9999 — every trial with gamma < 0.999 failed.
# inferno episodes are 3000+ ticks, needs effective horizon > 10000.

# replay_ratio recentered low — anything > 1.5 causes NaN with 7-head joint clipping
[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

# clip_coef recentered — high clip (>0.5) destabilized most runs
[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

# vf_coef recentered — anything > 2.0 killed training
[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.02
scale = 0.5

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.05
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

# --- replay / off-policy ---

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 0.8
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

# --- optimizer ---

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.3
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-12
max = 1e-5
scale = auto

[sweep.train.weight_decay]
distribution = log_normal
min = 0.001
max = 0.05
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

# reward shaping params are FIXED (not swept) to prevent reward hacking.
# optimize training dynamics against stable reward signal.
