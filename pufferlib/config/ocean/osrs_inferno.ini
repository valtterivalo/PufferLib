# Config for OSRS Inferno encounter.
# 9 action heads (87 mask logits), 546 obs + 87 mask = 633 total, long episodes (300-8000+ ticks).
# Hyperparams from the best fast Zuk sweep trial: logs/osrs_inferno/1777536666822.json
# (episode_return ~= 1.16, damage_dealt ~= 117 at 12.5M steps / 32s wall clock).
# total_timesteps is the exact step count that trial ran (12,517,376) so the LR
# anneal schedule matches the trial precisely. ~30-40s wall clock for tight
# iteration; bump up if you want a longer training run.

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return_normal

[env]
start_wave = 69
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.01
tag_reward_coeff = 0.25
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
# reward shaping (defaults preserve current behavior). win_bonus_coeff
# defaults to 0 → encounter falls back to hardcoded +1.0 win reward.
# stage R1 reward variants set these explicitly per sweep .ini.
win_bonus_coeff = 0.0
death_penalty_coeff = 0.0
phase_900_bonus = 0.0
phase_600_bonus = 0.0
phase_300_bonus = 0.0
shield_penalty_episode_cap = 0.0
record_best_replay_path = ""
play_replay_path = ""
# curriculum: fraction of agents starting at later waves (rest at start_wave)
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

# phase 2 backward curriculum: when phase2_demo_dir is non-empty, pufferl
# loads demos from that dir, builds snapshot ladders, and restores envs
# from those ladders on terminal-reset (mixing in normal_start_frac normal
# resets).
phase2_demo_dir = ""
phase2_num_atns = 9
phase2_snapshot_stride = 4
phase2_max_demos = 64
phase2_seed = 42
phase2_normal_start_frac = 0.25
phase2_randomize_rng_frac = 0.25
phase2_diagnostic_phase = 0
phase2_diagnostic_tries = 64
phase2_max_player_attack_timer = -1
phase2_bc_coef = 0.0
phase2_bc_demos_per_minibatch = 0
phase2_promote_rate = 0.30
phase2_demote_rate = 0.10
phase2_backstep_ticks = 4
phase2_success_q_delta = 0.005

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 12_517_376
horizon = 128
min_lr_ratio = 0.19884977024048567
learning_rate = 0.0012921193496570847
beta1 = 0.9630657107662409
beta2 = 0.9998701883037843
eps = 0.00000198340901892478
ent_coef = 0.0014163227566683333
gamma = 0.9999302941993795
gae_lambda = 0.9188385592269864
vtrace_rho_clip = 2.53272457793355
vtrace_c_clip = 1.5499409781768918
prio_alpha = 0.030378273428810387
prio_beta0 = 0.10915755962109253
clip_coef = 0.15723073601722715
vf_coef = 0.11285151658431691
vf_clip_coef = 0.7082327392883598
max_grad_norm = 0.8732907958328724
replay_ratio = 0.2599485015962273
minibatch_size = 4096

[sweep]
min_sps = 100000
max_suggestion_cost = 720
max_runs = 0
gpus = 1
metric = episode_return_normal
metric_distribution = linear
sweep_only = total_timesteps, horizon, learning_rate, ent_coef, gamma, min_lr_ratio, beta1, eps, gae_lambda, vtrace_rho_clip, vtrace_c_clip, prio_alpha, prio_beta0, clip_coef, vf_coef, vf_clip_coef, max_grad_norm, replay_ratio, total_agents, num_layers

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000000
max = 150000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.999999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.75
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 1.6
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.2
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.02
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 0.75
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 0.75
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 3
scale = auto
