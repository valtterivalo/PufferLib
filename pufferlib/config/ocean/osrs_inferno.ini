# upstream CUDA config for OSRS Inferno encounter.
# 7 action heads (76 logits), 381+76 obs, long episodes (300-2000+ ticks).
# A100 at 3M SPS — wide search spaces, big models affordable.

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent

[vec]
total_agents = 4096
num_buffers = 4

[policy]
hidden_size = 128
num_layers = 2

[env]
start_wave = 0.0
mask_in_obs = 1.0
wave_reward_base = 0.001
wave_reward_scale = 1.1
brew_penalty = 0.03
brew_penalty_midpoint = 35.0
brew_penalty_width = 5.0
blood_heal_reward = 0.01
prayer_reward = 0.005

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.003
gamma = 0.9999
gae_lambda = 0.97
replay_ratio = 0.25
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 1.5
ent_coef = 0.005
horizon = 64
minibatch_size = 8192
min_lr_ratio = 0.1
weight_decay = 0.01

[sweep]
max_suggestion_cost = 900
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 500000000
max = 3000000000
scale = time

# --- model architecture ---

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 6
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 8
scale = auto

# --- core PPO hyperparams ---

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.1
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

# --- replay / off-policy ---

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 4.0
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

# --- optimizer ---

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
scale = auto

[sweep.train.weight_decay]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

# --- reward shaping ---

[sweep.env.wave_reward_base]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.env.wave_reward_scale]
distribution = uniform
min = 1.0
max = 1.5
scale = auto

[sweep.env.brew_penalty]
distribution = log_normal
min = 0.001
max = 0.2
scale = auto

[sweep.env.brew_penalty_midpoint]
distribution = uniform
min = 15.0
max = 55.0
scale = auto

[sweep.env.brew_penalty_width]
distribution = uniform
min = 1.0
max = 15.0
scale = auto

[sweep.env.blood_heal_reward]
distribution = log_normal
min = 0.0005
max = 0.1
scale = auto

[sweep.env.prayer_reward]
distribution = log_normal
min = 0.0005
max = 0.1
scale = auto
