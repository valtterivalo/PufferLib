# upstream CUDA config for OSRS Inferno encounter.
# 7 action heads (76 logits), 381+76 obs, long episodes (300-2000+ ticks).
# replay_ratio kept low (0.25) — joint-ratio clipping with 7 heads can
# produce large logratios at higher replay, especially early training.

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent

[vec]
total_agents = 4096
num_buffers = 4

[policy]
hidden_size = 128
num_layers = 2

[env]
start_wave = 0.0
mask_in_obs = 1.0
wave_reward_base = 0.001
wave_reward_scale = 1.1
brew_penalty = 0.03
brew_penalty_midpoint = 35.0
brew_penalty_width = 5.0
blood_heal_reward = 0.01
prayer_reward = 0.005

[train]
total_timesteps = 500_000_000
learning_rate = 0.003
gamma = 0.9999
gae_lambda = 0.97
replay_ratio = 0.25
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 1.5
ent_coef = 0.005
horizon = 64
minibatch_size = 8192
min_lr_ratio = 0.1
weight_decay = 0.01
