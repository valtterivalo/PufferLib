# Metal config for Zuk-only training (wave 69).
# short episodes (~30-300 ticks), focused on learning shield-dancing + DPS.
# default config from best sweep trial (trial 12, score 32.2).

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 69.0
mask_in_obs = 1.0

[vec]
total_agents = 512
num_buffers = 4

[policy]
hidden_size = 128
num_layers = 3

[train]
total_timesteps = 100000000
horizon = 32
learning_rate = 0.00139
beta1 = 0.8
beta2 = 0.982
ent_coef = 0.05
gamma = 0.99988
gae_lambda = 0.591
vtrace_rho_clip = 1.0
vtrace_c_clip = 2.24
prio_alpha = 0.999
prio_beta0 = 0.346
clip_coef = 0.829
vf_coef = 0.214
vf_clip_coef = 1.856
max_grad_norm = 2.29
replay_ratio = 2.47
minibatch_size = 2048
ns_iters = 5
weight_decay = 0.016
min_lr_ratio = 0.077
checkpoint_interval = 0

[sweep]
min_sps = 50000
max_suggestion_cost = 300
metric = episode_return
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 100000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.999
max = 0.999999
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.95
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
