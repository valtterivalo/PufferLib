scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 2.0
scale = auto

[sweep.train.vf_coef]
