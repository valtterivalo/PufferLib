# Metal config for Zuk-only training (wave 69).
# short episodes (~30-300 ticks), focused on learning shield-dancing + DPS.
# default config from best sweep trial (trial 7, score 15.5, first wins).

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 69.0
mask_in_obs = 1.0

[vec]
total_agents = 512
num_buffers = 4

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 100000000
horizon = 8
learning_rate = 0.000825
beta1 = 0.889
beta2 = 0.941
ent_coef = 0.002
gamma = 0.999997
gae_lambda = 0.963
vtrace_rho_clip = 1.99
vtrace_c_clip = 1.32
prio_alpha = 0.581
prio_beta0 = 0.18
clip_coef = 1.36
vf_coef = 0.2
vf_clip_coef = 0.756
max_grad_norm = 1.57
replay_ratio = 2.4
minibatch_size = 512
ns_iters = 5
weight_decay = 0.044
min_lr_ratio = 0.125
checkpoint_interval = 0

[sweep]
min_sps = 50000
max_suggestion_cost = 300
metric = episode_return
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 100000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.999
max = 0.999999
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.95
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 2.0
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
