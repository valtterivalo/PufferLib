# Metal config for Zuk-only training (wave 69).
# short episodes (~30-300 ticks), focused on learning shield-dancing + DPS.

[base]
package = ocean
env_name = puffer_osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 69.0
mask_in_obs = 1.0

[vec]
total_agents = 256
num_buffers = 2

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 50000000
horizon = 32
learning_rate = 0.003
beta1 = 0.95
ent_coef = 0.01
gamma = 0.997
gae_lambda = 0.95
vtrace_rho_clip = 1.5
vtrace_c_clip = 1.3
prio_alpha = 0.0
prio_beta0 = 0.5
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.5
max_grad_norm = 1.0
replay_ratio = 1.0
minibatch_size = 2048
ns_iters = 5
weight_decay = 0.001
min_lr_ratio = 0.1
checkpoint_interval = 0

[sweep]
min_sps = 50000
max_suggestion_cost = 300
metric = episode_return
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 20000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.05
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.5
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9
max = 0.999999
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.3
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 1.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.005
max = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
max = 5.0
scale = auto

[sweep.train.weight_decay]
distribution = log_normal
min = 0.0001
max = 1.0
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 8192
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.999
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 4096
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 3
scale = auto
