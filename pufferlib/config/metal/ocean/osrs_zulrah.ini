# Metal osrs_zulrah config.
# Anchor: sweep trial 601, fastest positive (score=0.88, 702K SPS).

[base]
score_metric = score

[env]
gear_tier = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 4

[policy]
hidden_size = 512
num_layers = 1

[train]
total_timesteps = 26000000
horizon = 16
min_lr_ratio = 0.35
learning_rate = 0.015
beta1 = 0.962
beta2 = 0.999
eps = 6.3e-4
ent_coef = 0.0056
gamma = 0.997
gae_lambda = 0.824
vtrace_rho_clip = 1.25
vtrace_c_clip = 2.69
prio_alpha = 0.93
prio_beta0 = 0.01
clip_coef = 0.256
vf_coef = 0.418
vf_clip_coef = 0.1
max_grad_norm = 4.64
replay_ratio = 0.25
minibatch_size = 2048
ns_iters = 5

[sweep]
min_sps = 50000
max_suggestion_cost = 1800
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 20000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.05
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.train.gamma]
