# Metal osrs_inferno config.
# long episodes (300-2000+ ticks), 7 action heads (76 logits), 380+76 obs.
# vf_coef must stay low (< 0.15) — fused decoder amplifies value gradients
# into policy logits via MinGRU scan backward. replay_ratio < 1.0 to avoid
# stale target drift.

[base]
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 4

[policy]
hidden_size = 256
num_layers = 3

[train]
# best from sweep trial #57, score 2.64 at 200M steps
total_timesteps = 300000000
horizon = 32
min_lr_ratio = 0.0
learning_rate = 0.003
beta1 = 0.864
eps = 1e-6
ent_coef = 0.0155
gamma = 0.9995
gae_lambda = 0.8
vtrace_rho_clip = 3.0
vtrace_c_clip = 2.5
prio_alpha = 0.672
prio_beta0 = 0.566
clip_coef = 0.205
vf_coef = 0.039
vf_clip_coef = 1.0
max_grad_norm = 0.584
replay_ratio = 0.265
minibatch_size = 8192
ns_iters = 5

[sweep]
min_sps = 50000
max_suggestion_cost = 3600
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 200000000
max = 1000000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.3
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.95
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.8
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.25
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.005
max = 0.15
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.0
scale = auto
