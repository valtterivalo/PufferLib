# Metal osrs_inferno config.
# 8 action heads (79 logits), 1017 obs, long episodes (300-8000+ ticks).
# training dynamics now match CUDA (joint-ratio PPO, CUDA Muon scaling, fast scan).

[base]
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
# anchor: CUDA-informed but lr scaled down for Metal's Muon NS re-normalization
# (Metal NS output is ~16-32x larger than CUDA's, so lr needs to be lower).
# other hyperparams from CUDA sweep top trials.
total_timesteps = 400000000
train_fp16 = 1
horizon = 64
min_lr_ratio = 0.3
learning_rate = 0.001
beta1 = 0.93
eps = 0.000012
ent_coef = 0.03
gamma = 0.9999
gae_lambda = 0.64
vtrace_rho_clip = 1.5
vtrace_c_clip = 1.3
prio_alpha = 0.0
prio_beta0 = 0.6
clip_coef = 0.2
vf_coef = 0.2
vf_clip_coef = 0.28
max_grad_norm = 1.8
replay_ratio = 1.5
minibatch_size = 4096
ns_iters = 5

[sweep]
min_sps = 50000
max_suggestion_cost = 3600
metric = episode_return
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 200000000
max = 800000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.999
max = 0.999999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.4
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.999
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 1.0
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.005
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 4096
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.0
scale = auto
