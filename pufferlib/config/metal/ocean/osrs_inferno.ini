# Metal osrs_inferno config.
# long episodes (300-2000+ ticks), 7 action heads (77 logits), 381+77 obs.
# vf_coef must stay low (< 0.15) — fused decoder amplifies value gradients
# into policy logits via MinGRU scan backward. replay_ratio < 1.0 to avoid
# stale target drift.

[base]
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0
wave_reward_base = 0.001
wave_reward_scale = 1.1
brew_penalty = 0.03
brew_penalty_midpoint = 35.0
brew_penalty_width = 5.0
blood_heal_reward = 0.01
prayer_reward = 0.005
damage_taken_coef = 0.01

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 4

[policy]
hidden_size = 128
num_layers = 2

[train]
# anchor defaults re-tuned for fixed Metal backend (actions dtype + scatter-back).
# old defaults were optimized around two critical bugs and are invalid.
total_timesteps = 300000000
horizon = 32
min_lr_ratio = 0.245
learning_rate = 0.015
beta1 = 0.95
eps = 1e-6
ent_coef = 0.003
gamma = 0.9999
gae_lambda = 0.97
vtrace_rho_clip = 2.636
vtrace_c_clip = 1.0
prio_alpha = 0.372
prio_beta0 = 0.01
clip_coef = 0.3
vf_coef = 2.0
vf_clip_coef = 1.0
max_grad_norm = 1.507
replay_ratio = 1.0
minibatch_size = 4096
ns_iters = 5
weight_decay = 0.01

[sweep]
min_sps = 50000
max_suggestion_cost = 300
metric = episode_return
metric_distribution = linear

# total_timesteps fixed at 300M via [train] section override during sweep
# (not sweepable — removed to avoid min==max division by zero)

[sweep.train.weight_decay]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.003
max = 0.07
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.ns_iters]
distribution = int_uniform
min = 3
max = 5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.01
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = log_normal
min = 0.25
max = 3.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.2
max = 3.0
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.01
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 0.5
scale = auto

# num_buffers removed from sweep — segfaults with values != 4
# [sweep.train.num_buffers]

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.0
scale = auto

[sweep.env.wave_reward_base]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.env.wave_reward_scale]
distribution = uniform
min = 1.05
max = 1.2
scale = auto

[sweep.env.brew_penalty]
distribution = log_normal
min = 0.005
max = 0.1
scale = auto

[sweep.env.brew_penalty_midpoint]
distribution = uniform
min = 20.0
max = 50.0
scale = auto

[sweep.env.brew_penalty_width]
distribution = uniform
min = 2.0
max = 10.0
scale = auto

[sweep.env.blood_heal_reward]
distribution = log_normal
min = 0.001
max = 0.05
scale = auto

# prayer_reward sweep removed — prayer reward disabled in code (camping exploit)
# [sweep.env.prayer_reward]

[sweep.env.damage_taken_coef]
distribution = log_normal
min = 0.005
max = 0.05
scale = auto
