# Metal osrs_inferno config.
# Anchor: lr=0.002 confirmed stable at 10M steps (ret 0.76->1.57).
# Long episodes, large action space, needs high entropy to explore.

[base]
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 2

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 100000000
horizon = 32
min_lr_ratio = 0.1
learning_rate = 0.002
beta1 = 0.9
beta2 = 0.999
eps = 1e-5
ent_coef = 0.005
gamma = 0.997
gae_lambda = 0.85
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.5
prio_alpha = 0.5
prio_beta0 = 0.3
clip_coef = 0.2
vf_coef = 0.2
vf_clip_coef = 0.5
max_grad_norm = 2.0
replay_ratio = 0.25
minibatch_size = 2048
ns_iters = 5

[sweep]
min_sps = 50000
max_suggestion_cost = 1800
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000000
max = 500000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.02
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.99999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.3
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.7
max = 0.99
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-3
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.99
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 3.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8.0
scale = auto
