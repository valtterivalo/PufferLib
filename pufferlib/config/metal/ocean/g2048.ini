# Metal g2048 config.
# Anchor: upstream-ish config adapted for Metal (hs=128 L=3 baseline).

[base]
score_metric = score

[env]
scaffolding_ratio = 0.0

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 4

[policy]
hidden_size = 128
num_layers = 3

[train]
total_timesteps = 200000000
horizon = 32
min_lr_ratio = 0.0
learning_rate = 0.003
beta1 = 0.9
beta2 = 0.999
eps = 1e-5
ent_coef = 0.01
gamma = 0.998
gae_lambda = 0.95
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.01
prio_beta0 = 0.4
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 0.1
max_grad_norm = 0.5
replay_ratio = 1.5
minibatch_size = 8192
ns_iters = 5
cpu_inference = 1
scaffolding_ratio = 0.5

[sweep]
min_sps = 100000
max_suggestion_cost = 7200

[sweep.train.total_timesteps]
distribution = log_normal
min = 300000000
max = 1000000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.25
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.02
scale = 0.5

[sweep.train.beta1]
distribution = uniform
min = 0.5
max = 0.95
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.95
max = 0.99999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-3
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.5
max = 0.99
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 8.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 6.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.2
max = 6.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.total_agents]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 2
max = 8
scale = auto

[sweep.train.ns_iters]
distribution = uniform
min = 3
max = 5.99
scale = auto

[sweep.train.scaffolding_ratio]
distribution = uniform
min = 0.0
max = 0.9
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.5
scale = auto
