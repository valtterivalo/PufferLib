# Metal osrs_pvp config.
# Anchor: from storm PufferLib 3.0+MPS proven config (95.5% winrate).
# NOTE: high replay_ratio (>0.5) causes NaN in multi-head envs. use 0.25.

[base]
score_metric = episode_return

[env]
opponent_type = 16.0
shaping_scale = 0.0
shaping_enabled = 0.0
mask_in_obs = 1.0

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 2

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 100000000
horizon = 128
min_lr_ratio = 0.1
learning_rate = 0.00112
beta1 = 0.95
beta2 = 0.999
eps = 1e-5
ent_coef = 0.0016
gamma = 0.991
gae_lambda = 0.845
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.5
prio_alpha = 0.914
prio_beta0 = 0.218
clip_coef = 0.32
vf_coef = 2.5
vf_clip_coef = 0.5
max_grad_norm = 2.0
replay_ratio = 0.25
minibatch_size = 4096
ns_iters = 5

[sweep]
min_sps = 50000
max_suggestion_cost = 3600
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.03
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00005
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.9999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.02
max = 0.3
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.1
max = 0.99
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-3
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.5
max = 0.99
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.05
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.6
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.5
max = 10.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2.0
max = 6.0
scale = auto
