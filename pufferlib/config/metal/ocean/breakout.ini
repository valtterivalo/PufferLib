# Metal breakout config.
# Best known: trial #203, score 854 at 200M steps, 3.23M SPS (M4 Pro).

[base]
score_metric = score

[env]
frameskip = 4.0
width = 576.0
height = 330.0
paddle_width = 62.0
paddle_height = 8.0
ball_width = 32.0
ball_height = 32.0
brick_width = 32.0
brick_height = 12.0
brick_rows = 6.0
brick_cols = 18.0
initial_ball_speed = 256.0
max_ball_speed = 448.0
paddle_speed = 620.0
continuous = 0.0

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 8

[policy]
hidden_size = 64
num_layers = 2

[train]
total_timesteps = 176000000
horizon = 32
min_lr_ratio = 0.113
learning_rate = 0.0669
beta1 = 0.523
beta2 = 0.993
eps = 6e-6
ent_coef = 0.0081
gamma = 0.920
gae_lambda = 0.931
vtrace_rho_clip = 1.828
vtrace_c_clip = 1.000
prio_alpha = 0.010
prio_beta0 = 0.976
clip_coef = 0.756
vf_coef = 2.956
vf_clip_coef = 2.824
max_grad_norm = 2.046
replay_ratio = 2.10
minibatch_size = 65536
ns_iters = 5
cpu_inference = 1

[sweep]
min_sps = 300000
max_suggestion_cost = 1800

[sweep.train.total_timesteps]
distribution = log_normal
min = 60000000
max = 200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.25
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
max = 0.3
scale = 0.5

[sweep.train.beta1]
distribution = uniform
min = 0.5
max = 0.95
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.95
max = 0.99999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-3
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.02
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.88
max = 0.998
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.5
max = 0.99
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 8.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.3
max = 6.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 4.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 4.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 16384
max = 131072
scale = auto

[sweep.train.total_agents]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.train.num_buffers]
distribution = uniform_pow2
min = 2
max = 8
scale = auto

[sweep.train.ns_iters]
distribution = uniform
min = 3
max = 5.99
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 3.5
scale = auto
