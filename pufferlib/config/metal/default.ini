# Metal backend shared defaults for all envs.
# Per-env .ini files in ocean/ override only what differs.

[base]
score_metric = score

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 1

[env]

[policy]
hidden_size = 128
num_layers = 2

[train]
horizon = 32
learning_rate = 0.001
min_lr_ratio = 0.0
beta1 = 0.95
beta2 = 0.999
eps = 1e-5
minibatch_size = 4096
replay_ratio = 0.25
total_timesteps = 100000000
max_grad_norm = 2.0
clip_coef = 0.2
vf_clip_coef = 0.5
vf_coef = 0.5
ent_coef = 0.01
gamma = 0.99
gae_lambda = 0.95
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.3
overlap = 1
cpu_inference = 0
profile = 0
train_fp16 = 0
ns_iters = 5
seed = 42

[sweep]
method = Protein
metric_distribution = linear
goal = maximize
downsample = 5
min_sps = 100000
max_suggestion_cost = 1800
prune_pareto = true
early_stop_quantile = 0.3
