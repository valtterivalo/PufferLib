# Best Metal breakout config (trial #203, score 854 at 200M steps, 3.23M SPS)
# M4 Pro, muon optimizer, CPU inference + overlap, tensor_ops NT enabled
[train]
horizon = 32
learning_rate = 0.0786
min_lr_ratio = 0.120
beta1 = 0.558
beta2 = 0.984
eps = 8e-6
minibatch_size = 65536
# NOTE: high replay_ratio works for breakout (1 action head) but causes NaN
# in multi-head envs (osrs_pvp 7 heads). use 0.25-0.5 for multi-head envs.
replay_ratio = 1.93
total_timesteps = 200000000
max_grad_norm = 1.225
clip_coef = 1.112
vf_clip_coef = 2.627
vf_coef = 4.938
ent_coef = 0.0025
gamma = 0.922
gae_lambda = 0.959
vtrace_rho_clip = 1.610
vtrace_c_clip = 1.000
prio_alpha = 0.010
prio_beta0 = 0.974
total_agents = 2048
num_buffers = 8
num_threads = 8

[policy]
hidden_size = 64
num_layers = 2
