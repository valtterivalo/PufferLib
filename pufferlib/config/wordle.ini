[base]
env_name = wordle

[env]
mask_in_obs = 1.0
reward_win = 1.0

[vec]
total_agents = 256
num_buffers = 1

[policy]
hidden_size = 512
num_layers = 4

[train]
total_timesteps = 2333191
learning_rate = 0.010
ent_coef = 0.0001
gamma = 0.9994
gae_lambda = 0.20
replay_ratio = 8.0
vf_coef = 4.82
vf_clip_coef = 4.14
clip_coef = 0.34
max_grad_norm = 0.21
vtrace_rho_clip = 1.54
vtrace_c_clip = 5.0
beta1 = 0.977
beta2 = 0.983
eps = 1e-14
prio_alpha = 0.0
prio_beta0 = 0.28
horizon = 64
minibatch_size = 8192
train_fp16 = 1
cpu_inference = 0
overlap = 1

[sweep]
gpus = 1
max_suggestion_cost = 1200

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e6
max = 5e7
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
mean = 256
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
mean = 3
max = 4
scale = auto

# Memory-bound ceilings: rollout buffer is num_buffers * total_agents *
# horizon * WORDLE_OBS_TOTAL (3866) * 4 bytes. M4 Pro with 12GB wired
# overhead has ~30GB usable; configs above ~6GB rollout swap-kill the
# worker and hang the sweep. top-12 trials use total_agents <= 2048,
# num_buffers = 1, horizon <= 64, so ceilings here cost zero score.

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
mean = 1024
max = 2048
scale = auto

# num_buffers tightened from default [1, 8] to [1, 2]. min==max would
# divide-by-zero in Linear.normalize, so we sample [1, 2] uniform and
# rely on float-to-int round (sweep commit 2c955434f) to land on 1 most
# of the time. top-12 trials are 10/12 at buffers=1.

[sweep.vec.num_buffers]
distribution = uniform
min = 1
mean = 1
max = 2
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
mean = 32
max = 64
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.002
max = 0.015
scale = 0.5

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
mean = 2.0
max = 16.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 256
mean = 2048
max = 16384
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-6
mean = 0.005
max = 0.10
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.995
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.99999
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 10.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

# cpu_inference and overlap are pinned to the [train] anchor values
# (cpu_inference=0, overlap=1) by omitting their sweep blocks. setting
# min==max in int_uniform divides by zero in pufferlib/sweep.py:65.

