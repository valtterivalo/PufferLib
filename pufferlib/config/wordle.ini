[base]
env_name = wordle

[train]
learning_rate = 0.001
ent_coef = 0.02
train_fp16 = 1
cpu_inference = 1
overlap = 1

[sweep]
gpus = 1
max_suggestion_cost = 600

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.0005
max = 0.005
scale = 0.5

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
mean = 8192
max = 65536
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0.001
mean = 0.01
max = 0.05
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

[sweep.train.cpu_inference]
distribution = int_uniform
min = 0
mean = 0
max = 1
scale = auto

[sweep.train.overlap]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto
