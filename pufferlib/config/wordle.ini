[base]
env_name = wordle

[env]
reward_step = -0.01
reward_info = 0.10
reward_win = 1.0
reward_fail = -0.2
reward_repeat = -0.05

[sweep]
gpus = 1
max_suggestion_cost = 600

[sweep.env.reward_info]
distribution = uniform
min = 0.02
mean = 0.10
max = 0.50
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.0005
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = uniform
min = 0.001
mean = 0.01
max = 0.05
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

[sweep.train.cpu_inference]
distribution = int_uniform
min = 0
mean = 0
max = 1
scale = auto

[sweep.train.overlap]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto
