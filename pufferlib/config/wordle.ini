[base]
env_name = wordle

[env]
mask_in_obs = 1.0
reward_win = 1.0

[vec]
total_agents = 512
num_buffers = 2

[policy]
hidden_size = 512
num_layers = 3

[train]
learning_rate = 0.0029
ent_coef = 0.038
gamma = 0.956
gae_lambda = 0.58
replay_ratio = 0.57
vf_coef = 2.4
max_grad_norm = 2.62
horizon = 64
minibatch_size = 4096
train_fp16 = 1
cpu_inference = 1
overlap = 0

[sweep]
gpus = 1
max_suggestion_cost = 1200

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e6
max = 5e7
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
mean = 256
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
mean = 3
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
mean = 1024
max = 4096
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
mean = 4
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
mean = 64
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.0005
max = 0.005
scale = 0.5

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 256
mean = 4096
max = 65536
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0.001
mean = 0.02
max = 0.10
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

[sweep.train.cpu_inference]
distribution = int_uniform
min = 0
mean = 0
max = 1
scale = auto

[sweep.train.overlap]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

