[base]
env_name = wordle

[env]
mask_in_obs = 1.0
reward_win = 1.0

[vec]
total_agents = 256
num_buffers = 1

[policy]
hidden_size = 512
num_layers = 4

[train]
total_timesteps = 2333191
learning_rate = 0.010
ent_coef = 0.0001
gamma = 0.9994
gae_lambda = 0.20
replay_ratio = 8.0
vf_coef = 4.82
vf_clip_coef = 4.14
clip_coef = 0.34
max_grad_norm = 0.21
vtrace_rho_clip = 1.54
vtrace_c_clip = 5.0
beta1 = 0.977
beta2 = 0.983
eps = 1e-14
prio_alpha = 0.0
prio_beta0 = 0.28
horizon = 64
minibatch_size = 8192
train_fp16 = 1
cpu_inference = 0
overlap = 1

[sweep]
gpus = 1
max_suggestion_cost = 1200

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e6
max = 5e7
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
mean = 256
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
mean = 3
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
mean = 1024
max = 4096
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
mean = 4
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
mean = 64
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = uniform
min = 0.0001
mean = 0.002
max = 0.015
scale = 0.5

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
mean = 2.0
max = 16.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 256
mean = 4096
max = 65536
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-6
mean = 0.005
max = 0.10
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.995
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.99999
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 10.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.train_fp16]
distribution = int_uniform
min = 0
mean = 1
max = 1
scale = auto

[sweep.train.cpu_inference]
distribution = int_uniform
min = 0
mean = 0
max = 0
scale = auto

[sweep.train.overlap]
distribution = int_uniform
min = 1
mean = 1
max = 1
scale = auto

