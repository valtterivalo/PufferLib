[base]
async = 0
eval_episodes = 0
checkpoint_interval = 64

[env]
opponent_type = 33
gear_tier = 3
is_lms = 1
use_c_opponent = 1
self_play = 0
selfplay_match_fraction = 1
auto_reset = 0
shaping_enabled = 0
shaping_scale = 1.0
terminal_reward_coef = 0.5
damage_dealt_coef = 0.000375
damage_received_coef = -0.000375
damage_burst_bonus = 0.000375
correct_prayer_bonus = 0.005
off_prayer_hit_bonus = 0.005
spec_off_prayer_bonus = 0.005
spec_low_defence_bonus = 0.005
spec_low_hp_bonus = 0.005
smart_triple_eat_bonus = 0.005
ko_bonus = 0.005
ko_supplies_bonus_coef = 0.005
wrong_prayer_penalty = -0.005
prayer_switch_no_attack_penalty = -0.005
premature_eat_penalty = -0.005
magic_no_staff_penalty = -0.005
gear_mismatch_penalty = -0.005
wasted_resources_penalty = -0.005
wasted_eat_penalty = -0.00025
wasted_triple_eat_penalty = -0.00025
click_penalty_coef = -0.00025
prayer_penalty_enabled = 1
click_penalty_enabled = 1
click_penalty_threshold = 4
damage_burst_threshold = 30
premature_eat_threshold = 0.7071

[vec]
total_agents = 1024
num_threads = 8
num_policies = 1
hist_policy_percent = 0

[selfplay]
enabled = 0
eval_bot_games = 1024
eval_bot_envs = 32
eval_bot_threads = 8
eval_bots = 23,35,36,37

[bot_eval]
selfplay_match_fraction = 0
terminal_reward_coef = 1.0
self_play = 0
use_c_opponent = 1
shaping_enabled = 0

[policy]
num_layers = 2

[train]
total_timesteps = 60000000
learning_rate = 0.0005
vf_coef = 0.5
max_grad_norm = 0.5

[sweep]
metric = selfplay/bot_ladder_perf
max_suggestion_cost = 300
gpus = 1
downsample = 1

[sweep.env.shaping_enabled]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.env.shaping_scale]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.env.terminal_reward_coef]
