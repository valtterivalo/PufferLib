# OSRS Inferno encounter.
# 8 action heads (79 logits), 1058 obs, long episodes (300-8000+ ticks).

[base]
env_name = osrs_inferno
score_metric = episode_return

[env]
start_wave = 35.0
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.01
tag_reward_coeff = 0.25
mask_in_obs = 1.0
# curriculum: fraction of agents starting at later waves (rest at start_wave)
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.00
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.00
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.00

[vec]
total_agents = 8192
num_buffers = 4

[policy]
hidden_size = 128
num_layers = 3

[train]
total_timesteps = 400_000_000

[sweep.env.damage_reward_coeff]
distribution = linear
min = 0.0
max = 0.1
mean = 0.01
scale = auto

[sweep.env.shield_penalty_coeff]
distribution = linear
min = 0.0
max = 0.1
mean = 0.01
scale = auto

[sweep.env.tag_reward_coeff]
distribution = linear
min = 0.0
max = 1.0
mean = 0.25
scale = auto
