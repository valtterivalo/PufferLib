# OSRS Inferno encounter.
# 8 action heads (79 logits), 1058 obs, long episodes (300-8000+ ticks).

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = episode_return

[env]
start_wave = 0.0
mask_in_obs = 1.0
# curriculum: fraction of agents starting at later waves (rest at start_wave)
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.10
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.05
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.05

[vec]
total_agents = 256
num_buffers = 2

[policy]
hidden_size = 512
num_layers = 3

[train]
# anchor from CUDA sweep (100 trials, 4080S). best config for wave 28-30 range.
# real progress requires 10B+ steps on multi-GPU — short sweeps only find brute-force configs.
total_timesteps = 1600000000
horizon = 64
min_lr_ratio = 0.4465
learning_rate = 0.004373
beta1 = 0.9337
eps = 0.000012
ent_coef = 0.026798
gamma = 0.9999145
gae_lambda = 0.6379
vtrace_rho_clip = 1.552
vtrace_c_clip = 1.322
prio_alpha = 0.0
prio_beta0 = 0.6249
clip_coef = 0.2
vf_coef = 0.2132
vf_clip_coef = 0.282447
max_grad_norm = 1.799
replay_ratio = 1.538
minibatch_size = 4096
ns_iters = 5
weight_decay = 0.00227
checkpoint_interval = 0

[sweep]
min_sps = 50000
max_suggestion_cost = 3600
metric = episode_return
metric_distribution = linear

[sweep.train.total_timesteps]
distribution = log_normal
min = 500000000
max = 3200000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.999999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.train.beta1]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-6
max = 1e-4
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 2.5
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.999
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.01
max = 0.8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 1.5
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.005
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.weight_decay]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 128
max = 4096
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 5.0
scale = auto
