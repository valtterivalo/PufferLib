[base]
async = 0

[env]
opponent_type = 0
self_play = 1
live_loadout = 0
opponent_pool = 0
selfplay_pool_probability = 0.5
; kit_same_class: the share of new opponents whose kit is of our kit's class (Dharok's, Soulreaper, melee; riskfight_loadout_class), the rest drawn without a
; condition: in Dharok's we mostly meet Dharok's, rarely a Voidwaker or Soulreaper kit, and the other way round. Also how a net-played seat 1 draws its kit.
kit_same_class = 0.8
; learner_random_kit: the share of sessions in which seat 0 wears a pool kit it can play (no ranged weapon: under deployable the plugin keeps Piety) instead
; of one of our kits (live_loadout 3 or 4 only). Pure self-play draws seat 1 by the same rule.
learner_random_kit = 0.25
deployable = 0
motor = 0
; data_escapes 1: a net in seat 1 (pure self-play or a frozen checkpoint) never teleports by its own choice (its teleport is masked); it leaves when the scripts'
; data-fitted escape rule fires (RF_DHAROK_TAB_PM on its hitpoints in a Dharok kit, the opponent profile's tab_pm otherwise), and that tick is a step of no choice.
; Fighting comes from the net, leaving from the recorded players: in a mirror of one policy leaving is worth what fighting is (0) and both seats learned to leave.
data_escapes = 1
; death_price 0 draws the price of every new opponent log-uniform in [0.4, 2.5]: training keeps it wide (the live prices run from 0.1 to 2.5, riskfight_starts_data.h).
death_price = 0
price_table = 0
; fight_starts 1: a fight starts as one of the user's recorded fights did (who swung first, hitpoints, his bar, specials, Vengeance, supplies used, distance), drawn whole
; from the 161 recorded starts; 0: both sides regeared at 121 hitpoints before any swing (ocean/osrs/encounters/riskfight/riskfight_start.h).
fight_starts = 1
oppfit_probability = 0
domain_randomization = 0
damage_reward_coeff = 0
chance_reward_coeff = 0
scripted_probability = 0
scripted_omission_initial = 0.8
scripted_omission_decay_ticks = 150000
midfight_probability = 0
midfight_max_ticks = 128
session_ticks = 3000
curveball_probability = 0.1
; What our reputation (rude teleports of the session) costs (riskfight_session.h): the search for a new opponent takes R * (1 + rep_search * rep), a new
; opponent rags with min(0.6, rep_rag * rep), and rep halves every rep_half_life ticks.
rep_search = 2.0
rep_rag = 0.3
rep_half_life = 6000

[vec]
total_agents = 1024
num_threads = 32
num_buffers = 2
num_policies = 2
hist_policy_percent = 0.5

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 60000000
horizon = 64
minibatch_size = 4096
learning_rate = 0.0005

[selfplay]
enabled = 1
opp_timeout_steps = 1048576
; A checkpoint every 16 epochs while self-play is on (the frozen pool, max_size 16, grows by one each): a 5e7-step run of the sweep's 16384 x 32 batch is 95
; epochs, so [base] checkpoint_interval 128 left the pool the initial and final checkpoints only.
checkpoint_interval = 16
eval_bot_games = 512
eval_bot_envs = 32
eval_bots = 0,1

[bot_eval]
; The end-of-trial eval of the sweep (selfplay/bot_ladder_perf, the score Protein sees): the final checkpoint plays whole sessions against the population we
; meet live, the pool kits played by the script (rung 0: the training humans, rung 1: the held-out humans) or by OppFit, never a self-play opponent. Pinned here
; so the score does not move with the swept or launch-time [env] keys.
self_play = 0
scripted_probability = 0
scripted_omission_initial = 0
scripted_omission_decay_ticks = 0
midfight_probability = 0
; Our kits only, and his kit without a class condition, as the score was before kit_same_class (comparable across sweeps).
learner_random_kit = 0
kit_same_class = 0
midfight_max_ticks = 0
damage_reward_coeff = 0
chance_reward_coeff = 0
opponent_pool = 1
oppfit_probability = 0.5
; Our kit drawn per session as in training (4: the Dharok kit half the time, the three VW kits the rest), so the score counts both setups.
live_loadout = 4
deployable = 1
motor = 1
domain_randomization = 1
; The deployment price: us / him gp as the live server clamps it, drawn from the 89 first meetings with a stakes line in the client logs (scripts/measure_fight_starts.py).
death_price = 0
price_table = 1
fight_starts = 1
session_ticks = 3000

[sweep]
; Score: kills minus price x deaths per hour (env/perf = net_stake) of the final checkpoint against the live population, selfplay/bot_ladder_perf: the mean
; over the [selfplay] eval_bots rungs of eval_bot_games sessions each, under [bot_eval]. Training-log net_stake mixes self-play opponents and is not used.
metric = selfplay/bot_ladder_perf
metric_distribution = linear
goal = maximize
max_runs = 400
gpus = 1
downsample = 1
max_suggestion_cost = 3600
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 1e10
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 8192
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.02
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-06
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.99
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.9
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.1
max = 5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.25
max = 4
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 1
scale = auto

[sweep.selfplay.enabled]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.env.scripted_probability]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.env.selfplay_pool_probability]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.1
max = 1
scale = auto
