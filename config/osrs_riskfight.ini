[base]
async = 0

[env]
opponent_type = 0
self_play = 1
damage_reward_coeff = 0
teleport_penalty = 0

[vec]
total_agents = 1024
num_threads = 4
num_buffers = 2
num_policies = 2
hist_policy_percent = 0.5
action_mask_size = 461

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 60000000
horizon = 64
minibatch_size = 4096
learning_rate = 0.0005

[selfplay]
enabled = 1
opp_timeout_steps = 1048576
eval_bot_games = 256
eval_bot_envs = 32
eval_bots = 0,1,2,4

[bot_eval]
self_play = 0
damage_reward_coeff = 0
teleport_penalty = 0


[sweep]
metric = net_stake
metric_distribution = linear
goal = maximize
max_runs = 24
gpus = 1
downsample = 1
max_suggestion_cost = 300
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 512
max = 2048
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.02
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-05
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.99
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 4
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 1
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.25
max = 4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.85
max = 0.995
scale = auto

[sweep.env.damage_reward_coeff]
distribution = uniform
min = 0
max = 0.005
scale = auto

[sweep.env.teleport_penalty]
distribution = uniform
min = 0
max = 0.25
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 262144
max = 4194304
scale = auto
