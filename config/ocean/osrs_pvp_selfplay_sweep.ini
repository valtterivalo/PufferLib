[base]
env_name = osrs_pvp
score_metric = score
log_dir = logs_pvp_selfplay_sweep_20260523
checkpoint_dir = checkpoints_pvp_selfplay_sweep_20260523
checkpoint_interval = 0
eval_episodes = 4096

[env]
seed = 73
opponent_type = 0
gear_tier = 3
shaping_enabled = 1
shaping_scale = 0.2
use_rollout_opponent = 1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16
num_frozen_banks = 2
frozen_bank_pct = 0.2

[selfplay]
enabled = 1
max_size = 200
swap_winrate = 0.65
min_games = 2048
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 50_000_000
opp_timeout_steps = 200_000_000
sampling = pfsp_var

[policy]
hidden_size = 128
num_layers = 1
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 60_000_000
horizon = 16
minibatch_size = 8192
learning_rate = 0.005
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.997
gae_lambda = 0.5
ent_coef = 0.0001
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
clip_coef = 0.23
vf_coef = 2.5
vf_clip_coef = 0.05
max_grad_norm = 1.16
replay_ratio = 3.0
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 900
max_runs = 60
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.30
sweep_only = train.total_timesteps, train.horizon, train.learning_rate, train.ent_coef, train.gamma, train.gae_lambda, train.clip_coef, train.vf_coef, train.vf_clip_coef, train.max_grad_norm, train.replay_ratio, policy.hidden_size, selfplay.swap_winrate, env.shaping_scale

[sweep.train.total_timesteps]
distribution = log_normal
min = 20_000_000
max = 150_000_000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.985
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.40
max = 0.95
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.10
max = 0.35
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.5
max = 4.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 0.3
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.4
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.selfplay.swap_winrate]
distribution = uniform
min = 0.55
max = 0.85
scale = auto

[sweep.env.shaping_scale]
distribution = log_normal
min = 0.05
max = 0.5
scale = auto
