[base]
env_name = osrs_pvp
score_metric = score
log_dir = logs_pvp_sweep_20260523
checkpoint_dir = checkpoints_pvp_sweep_20260523
checkpoint_interval = 0
eval_episodes = 4096

[env]
seed = 73
opponent_type = 8
gear_tier = 3
shaping_enabled = 1
shaping_scale = 0.1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 30_000_000
horizon = 64
minibatch_size = 8192
learning_rate = 0.0005
gamma = 0.995
gae_lambda = 0.90
ent_coef = 0.001
clip_coef = 0.20
vf_coef = 0.5
vf_clip_coef = 0.20
max_grad_norm = 0.5
replay_ratio = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 600
max_runs = 80
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.30
sweep_only = train.total_timesteps, train.horizon, train.learning_rate, train.ent_coef, train.gamma, train.gae_lambda, train.clip_coef, train.vf_coef, train.vf_clip_coef, train.max_grad_norm, train.replay_ratio, vec.total_agents, policy.hidden_size, policy.num_layers, env.shaping_scale

[sweep.train.total_timesteps]
distribution = log_normal
min = 15_000_000
max = 120_000_000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.005
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.02
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.50
max = 0.99
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.08
max = 0.35
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.25
max = 2.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 3.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 3
scale = auto

[sweep.env.shaping_scale]
distribution = log_normal
min = 0.01
max = 0.4
scale = auto
