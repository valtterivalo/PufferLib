# Damage-received-scale anneal: train under reduced incoming damage early, ramp to
# full lethality. anneal_start is the starting scale (0.0 = full invuln, 1.0 = off);
# anneal_ticks is the ramp duration in PER-ENV c_step ticks (global_agent_steps /
# num_envs). Sweep these two, NOT player_damage_received_scale (the binding computes
# that per-step from the anneal).
[sweep.env.damage_scale_anneal_start]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

# PER-ENV ticks = total_timesteps / total_agents. A 50M/8192 run is ~6k ticks/env,
# a 500M/2048 run ~244k, so a meaningful ramp lives in the low thousands..low 100k,
# NOT the millions. Ramp should finish well before the run ends so the back half
# trains at full lethality.
[sweep.env.damage_scale_anneal_ticks]
distribution = uniform
min = 2000
max = 150000
scale = auto
