# Fortis Colosseum — sweep config. Reward knobs default to sparse (damage only);
# the sweep searches damage_reward_coeff broadly to probe whether advantages/rewards
# are wired correctly. Trials are cost-capped (max_suggestion_cost), not timestep-floored.

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score

[env]
start_wave = 1
damage_reward_coeff = 0.003
boss_damage_reward_coeff = 0.0
wave_clear_bonus = 1.0
boss_phase_bonus = 0.0
win_bonus = 0.0
prayer_correct_reward = 0.0
offpray_damage_penalty_coeff = 0.0
multistyle_exposure_penalty_coeff = 0.0
avoided_damage_coeff = 0.003
death_penalty_coeff = 0.05
timeout_penalty = 0.10
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
forecast_horizon = 4
mask_inventory_heads = 0
prayer_oracle_mode = 0
bis_gear_oracle_mode = 0
invuln_mode = 0
episode_max_ticks_override = 0
remove_brews = 0
prayer_switch_fail_prob = 0.0
player_damage_received_scale = 1.0
damage_scale_anneal_start = 1.0
# damage_scale_anneal_ticks is in PER-ENV c_step ticks (global_agent_steps / num_envs).
damage_scale_anneal_ticks = 0
mask_in_obs = 1.0
classic_curriculum_mode = 0
curriculum_num_tiers = 3
curriculum_wave_1 = 4
curriculum_frac_1 = 0.15
curriculum_wave_2 = 8
curriculum_frac_2 = 0.10
curriculum_wave_3 = 12
curriculum_frac_3 = 0.05

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 50000000
horizon = 16
min_lr_ratio = 0.000980071012242606
learning_rate = 0.0008596917323041326
momentum = 0.9641862728826048
eps = 0.000004655041309600953
ent_coef = 0.0000779653735730281
gamma = 0.9985
gae_lambda = 0.8103042852547117
vtrace_rho_clip = 1.329703794225126
vtrace_c_clip = 2.660933625087891
prio_alpha = 0.0999082172361816
prio_beta0 = 0.290550947491407
state_buffer_size = 8192
cl_frac = 0.10
anneal_cl = 0
warmup_states = 1024
state_checkpoint_interval = 16
explore_alpha = 1.0
explore_beta = 0.0
explore_decay = 0.99
clip_coef = 0.008335857515250372
vf_coef = 1.9655295251669234
vf_clip_coef = 0.03
max_grad_norm = 1.9495704455155376
replay_ratio = 4.0
minibatch_size = 4096

[sweep]
method = Protein
max_suggestion_cost = 400
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
# STATE-SET CL ISOLATED 2026-06-24: sweep ONLY the upstream state-set curriculum
# (src/curriculum.cu) -- cl_frac (0 = OFF .. on), state_buffer_size, the checkpoint
# interval, and explore_beta -- with reward/PPO/arch fixed and the hand-rolled manual
# curriculum DISABLED (classic_curriculum_mode=0 in [env]; it hurt wave-1 learning:
# invuln@100M 17.6% OFF vs 5.5% ON). cl_frac default 0.10 in [train] so non-sweep runs
# also activate CL. For the reward+prayer-fail sweep, swap this line for:
# sweep_only = offpray_damage_penalty_coeff, avoided_damage_coeff, prayer_switch_fail_prob, multistyle_exposure_penalty_coeff
sweep_only = offpray_damage_penalty_coeff, avoided_damage_coeff, prayer_switch_fail_prob, multistyle_exposure_penalty_coeff
resume_from_log_dir =

[sweep.train.total_timesteps]
distribution = log_normal
min = 5_000_000
max = 500_000_000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00005
max = 0.005
scale = 0.5

[sweep.train.ent_coef]
