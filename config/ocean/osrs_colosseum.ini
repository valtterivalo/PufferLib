# Fortis Colosseum. Train default baked 2026-07-10: clear-brook-983, the PARETO-KNEE pick from
# the solve sweep (W&B group colosseum-solve-20260708, run id vmg95xgy): score 0.521 final /
# 0.577 peak in 0.90h at 143M steps, hs2048/L2. Chosen over the outright top scorer
# dainty-hill-985 (0.526 final / 0.664 peak, hs4096, id zar6uvk1, 4.35h) for ITERATION SPEED:
# 99% of the final score at ~1/5 the wall-clock, gap deep inside the ~0.08 anchor noise band.
# The sweep BROKE the 0.30-0.40 plateau (honest anchor 0.301, 31 trials): recipe = clip_coef
# off the old near-floor 0.027 (~0.07), classic curriculum fracs ON, wave_clear_bonus ~1,
# low-but-nonzero death_penalty, lr 3.7e-4, vf_coef 1.9. Wins remain 0 in every trial.
# dainty-hill-985 deltas for a max-score rerun: hidden_size 4096, total_timesteps 173528116,
# lr 0.00043664809922131566, gae_lambda 0.4354778491068707, clip_coef 0.06777522336923018,
# vf_coef 1.3861064579949691, max_grad_norm 1.399436585886996, momentum 0.9983095260688868,
# min_lr_ratio 0.25476005370544064, prio_alpha/beta0 0.3108577977963118/0.01574143747213208,
# vtrace_rho/c 2.3329323990044015/4.352044927977765, gamma 0.9999999, fresh_frac
# 0.019106131340135092 + num_start_states 132, env.damage_reward_coeff 0.034661439390314054,
# env.wave_clear_bonus 1.482724677691016, env.win_bonus 3.1352882259141515,
# env.death_penalty_coeff 0.0363251779794983, env.timeout_penalty 0.2558725233573525,
# curriculum fracs 0.09099455004317795/0.04901429548031856/0.
# CAVEAT: every solve-sweep trial ran with BARE late starts (pre-late_start_state_mode, shipped
# 2026-07-10), so the winning curriculum fracs were priced on fantasy-easy tier states; they
# need revalidation under honest entry states. SOTA history + provenance: COLOSSEUM_SOTA.md.
#
# Superseded prior default: feasible-snowflake-933 (bigsweep knee qt92v342, wave 7.65 / 0.471,
# baked 2026-07-03) -- its recipe (clip 0.027 near the floor, curriculum off, death_penalty 0)
# is dominated by the solve-sweep frontier.
#
# The [sweep] section below is retained for future sweeps and does NOT affect a plain train run.
# It prices reward alignment + gear/obs levers on the corrected sim; sweep_only gates which params
# Protein searches. Lesson carried from the broad/focused sweeps: freeing total_timesteps (the
# compute horizon) is the dominant lever -- fixed-50M sweeps confounded gamma + architecture, so
# capacity (hidden_size/num_layers) and horizon are studied JOINTLY, never pinned.

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score
# Isolated from the shared logs/ dir (900+ old-group jsons) so sweep resume + writes stay clean.
# logs_sol_sweep_fair = the 2026-07-13 Sol-only sweep on the FAIR fight (post reaction-window
# fixes 984144399/012d8c40b/b3962bdc1). Prior dirs kept on the box for the record:
# logs_sol_sweep (the 2026-07-10 Sol-only sweep -- priced the UNFAIR fight, its 33
# observations must never seed a fair-fight surrogate), logs_solve (full-space solve sweep,
# knee baked above), logs_sol / logs_sol_confirm (standalone Sol runs), logs_clsweep and
# logs_bigsweep -- they sweep different dims/tasks/dynamics, so replaying any of them here
# would poison this surrogate.
log_dir = logs_sol_clampsweep

[env]
start_wave = 1
damage_reward_coeff = 0.03221982750241437
wave_clear_bonus = 0.9480448239932152
win_bonus = 4.150041468647685
death_penalty_coeff = 0.07070182588381779
timeout_penalty = 0.39745351022900066
# reinforcement fresh damage pays no reward on waves below farm_cap_waves:
# the 2026-07-05 audit measured stall-farming at +3.3..+9.3 reward per overrun wave
# vs ~8.4 for the entire perfect-run event budget, with waves 2+ overrun on
# 92-100% of eval visits. The window was hardcoded to waves 1-4 (the skippable
# window) until the f9im4yp4 turtle finding showed wave-5+ farming is the stall's
# actual paycheck -- farm_cap_waves is now a swept knob (4 = old behavior, 12 =
# reinforcement damage never pays anywhere).
farm_safe_damage_cap = 1
farm_cap_waves = 4
# All shaping below was swept comprehensively (group colosseum-bigsweep-20260701) and didn't earn
# its place: each pinned at ~0 across the entire score frontier. C struct defaults are 0.0f
# (encounter_colosseum_helpers.inc) so leaving them unset is behavior-identical. Re-enable one only
# with new evidence (uncomment here + add to sweep_only + its [sweep.env.*] block).
# 2026-07-10: boss_damage_reward_coeff + boss_phase_bonus RE-ENABLED for the Sol-only sweep --
# they pinned at ~0 on FULL runs (where Sol is ~never reached), but were never priced on a
# Sol-only task where phase milestones are the natural dense signal (the inferno Zuk lesson:
# final-boss-only shaping earns its place when the boss IS the task).
boss_damage_reward_coeff = 0.0
boss_phase_bonus = 0.0
# prayer_correct_reward = 0.0
# offpray_damage_penalty_coeff = 0.0
# multistyle_exposure_penalty_coeff = 0.0
# argmax_gear + offensive_boost RE-ENABLED 2026-07-16 for the clamp-sweep retrial (the
# 07-02 drop priced them on the old sim + full-run task + clamp-corrupted damage scale).
argmax_gear_reward_coeff = 0.0
offensive_boost_reward_coeff = 0.0
# stall_penalty_coeff = 0.0
# avoided_damage_coeff = 0.0
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
threat_field_obs_enabled = 1
forecast_horizon = 4
mask_inventory_heads = 0
prayer_oracle_mode = 0
# start_wave>0 entry fidelity (curriculum + --wave): 2 = replay recorded organic
# wave entries once real runs reach the wave, synthetic prior (draft-history
# replay + supply depletion) until then; 1 = prior only; 0 = legacy bare start.
late_start_state_mode = 2
late_start_supply_fraction_per_wave = 0.07
bis_gear_oracle_mode = 0
invuln_mode = 0
episode_max_ticks_override = 0
remove_brews = 0
prayer_switch_fail_prob = 0.0
player_damage_received_scale = 1.0
damage_scale_anneal_start = 1.0
damage_scale_anneal_ticks = 0
mask_in_obs = 1.0
# Classic start-wave curriculum: mode pinned 1; fracs baked ON 2026-07-10 from the solve-sweep
# knee (the whole winner cluster used them -- first sweep where curriculum earned its place).
# Curriculum envs never feed the score/logs (binding.c gates on start_wave ==
# config_start_wave), so the fracs are score-safe. Tier rungs pinned at waves 4/8/12.
# CAVEAT: priced on BARE late starts; under late_start_state_mode 2 (honest entry states,
# shipped 2026-07-10) the tiers got harder, so the fracs need revalidation.
classic_curriculum_mode = 1
curriculum_num_tiers = 3
curriculum_wave_1 = 4
curriculum_frac_1 = 0.07367961709476761
curriculum_wave_2 = 8
curriculum_frac_2 = 0.03234710556986353
curriculum_wave_3 = 12
curriculum_frac_3 = 0.009776253765422502

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32

[policy]
hidden_size = 2048
num_layers = 2
expansion_factor = 1
# 1 swaps the default Linear encoder for the NPC entity-pool encoder (global Linear
# + masked maxpool over a shared per-NPC MLP). 0 = byte-identical to the Linear baseline.
entity_encoder = 1

[train]
total_timesteps = 143245903
horizon = 16
min_lr_ratio = 0.32764059472071716
learning_rate = 0.0003724286337024778
momentum = 0.999
eps = 4.655041309600953e-06
ent_coef = 1e-07
gamma = 0.9999997409988988
gae_lambda = 0.41662511987289663
vtrace_rho_clip = 2.0739707238638987
vtrace_c_clip = 3.444175403341336
prio_alpha = 0.2617270145386202
prio_beta0 = 0.0
# Best-trajectory curriculum (upstream 5.0-simplecl port): CL/fresh envs restart
# from snapshots along per-slot best trajectories; vanilla envs alone feed logs.
# Default OFF (num_start_states 0). Host RAM = (num_start_states + cl+fresh envs)
# * state_trajectory_max_len * sizeof(ColosseumState) (~52KB) -- e.g. 64 slots +
# 15% of 8192 envs at max_len 128 is ~8.5GB. Episodes run ~1350-4000+ ticks, so
# checkpoint_interval * max_len must cover the episode (32 * 128 = 4096).
# Probe values: num_start_states 64, cl_frac 0.10, fresh_frac 0.05.
num_start_states = 0
cl_frac = 0.0
fresh_frac = 0.0
state_trajectory_max_len = 128
state_checkpoint_interval = 32
clip_coef = 0.07092591964303953
vf_coef = 1.863286374780826
vf_clip_coef = 0.01
max_grad_norm = 2.5111866624698655
replay_ratio = 2.0
minibatch_size = 4096

[sweep]
method = Protein
# 2026-07-16 CLAMP-CONTRACT reward sweep (group colosseum-sol-clampsweep-20260716): the
# trainer hard-clamps per-step rewards to [-1,1] (src/pufferlib.cu clamp_precision_kernel,
# "our envs are mostly designed to respect this range") -- an ENV DESIGN CONTRACT, not a
# tunable: advantages are batch-normalized so reward SCALE is free, but any single-step
# reward above 1 is silently truncated and the sweep prices a corrupted lever (raising
# damage_reward_coeff saturates more ticks = FLATTENS the DPS signal instead of amplifying
# it; the fair sweep's dmg 0.026 saturated at ~38 damage while max scythe/claws ticks run
# ~95). This sweep repriced the reward economy INSIDE the contract on the fixed sim
# (bite-tick spears, 4dd400d6): damage_reward_coeff ceiling = 1/95 ~= 0.010 so the whole
# damage range stays proportional; event rewards (win/phase/death/timeout) ceilinged at
# 1.0 = the clamp itself; argmax_gear + offensive_boost shapers re-enabled for a CONSCIOUS
# retrial (dropped 2026-07-02 on the OLD sim + full-run task + clamp-corrupted damage
# scale -- three regime changes since); vf_coef/vf_clip re-swept because they are priced
# in ABSOLUTE return units and the return scale changes (vf_clip floor 0.003 -> 0.0005,
# it pinned the old floor); boss_damage_reward_coeff pinned 0 via launcher (collinear
# with damage_reward_coeff at Sol-only, fair sweep landed it at 0 -- its section is
# commented because the damage_reward_coeff token matches it by substring). Everything
# else (arch/optimizer/task) pinned to deep-serenity-1185 via sol_clampsweep.sh; anchor
# trial 0 = eternal-shadow (86.6% fixsim2 baseline) with rewards clamp-fitted + ts 100M
# to fit the cost cap. Fresh surrogate: logs_sol_sweep_fair priced the OLD sim and
# logs_sol_fixsim* priced intermediate sims -- none may seed this space.
# 2026-07-14 mid-sweep widening at ~115 trials (best divine-star-1113 92.8% final wins,
# hs512/L6, rolling best still climbing): the three REAL boundary pins widened --
# learning_rate floor 2e-4 -> 1e-4 (most of the frontier sat exactly on the floor),
# hidden_size floor 256 -> 128 (heavily sampled at floor; prices the small-fast extreme),
# num_layers ceiling 6 -> 8 (both leaders at L6 = ceiling). NOT widened despite top-8
# pins: death_penalty_coeff 1.0 / boss_phase_bonus 5.0 / win_bonus -- these land as
# single-step rewards and the trainer hard-clamps per-step rewards to [-1,1]
# (src/pufferlib.cu clamp_precision_kernel), so every value >= ~1 pays the identical
# +-1 pulse; the apparent ceiling pins are surrogate artifacts over a flat region.
# Restarted with resume_from_log_dir replaying all prior observations.
# 2026-07-13 SOL FAIR-FIGHT sweep (group colosseum-sol-fairsweep-20260713): reprice the
# Sol-only space on the corrected fight (AoE damage age 2, sand pillar strike +2, sphere
# enrage window, telegraphed enrage sand, Solarflare corner boxes). The 07-10 sweep priced
# the UNFAIR fight; its verbatim winner reproduced on the fair fight (warm-sun-1029) went
# 14.1% final / 16.1% peak wins with final ~= peak and STILL CLIMBING at the 30M cap --
# vs 5.4% collapsing final on the unfair fight. Anchor (trial 0, launcher CLI) = that
# warm-sun config verbatim, handing Protein a known-good observation. Space changes from
# the 07-10 edge analysis (top-8 of 33): ceiling-pinned levers widened (num_layers 4 -> 6,
# minibatch 4096 -> 8192, boss_damage_reward_coeff 0.05 -> 0.1) and floor-pinned vf_clip
# lowered (0.01 -> 0.003); hidden_size max back to 2048 (hs4096 = 1.9-5.4K SPS, three
# trials blew the 1200s cost cap ~10x and burned ~6h -- the cost GP does not protect
# random-phase suggestions); entity_encoder PINNED 2 via launcher (unanimous across the
# top-8 and validated by warm-sun, so it earns a pin and frees a dim). Fresh surrogate:
# resume_from_log_dir points at this sweep's own dir for crash recovery only.
# 2026-07-10 SOL-ONLY sweep (group colosseum-sol-sweep-20260710), CONCLUDED at 33 trials:
# Diagnostic: is Sol config-solvable to the user's 70%+ win-rate bar, or is something at the
# boss unreasonably hard/unfair (mis-timings are already known and queued for a fidelity
# pass)? Task pins live in the LAUNCHER (sol_sweep.sh: --env.start-wave 12, curriculum fracs
# 0, anchor total_timesteps 45M so trial 0 fits the cost cap); the honest-pond-993 baseline
# = the ini anchor at 143M drew 22% wins, still climbing. At start_wave 12 env/score ~= win
# rate (loss ceiling ~0.007, win 1.0), so metric = score IS the win-rate objective. Space
# changes vs the solve sweep: DROPPED wave_clear_bonus + farm_cap_waves (no wave clears/
# reinforcements at Sol), curriculum fracs (no journey), cl/fresh/num_start_states (pinned
# ~0 twice); ADDED boss_damage_reward_coeff + boss_phase_bonus (never priced on a boss-only
# task). max_suggestion_cost 1200s per the user (quick trials, many per hour).
max_suggestion_cost = 1200
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
# COMPREHENSIVE sweep on the corrected + DPT-deleted obs (2393), SEEDED from the running
# colosseum-bigsweep-20260701 (resume_from_log_dir replays its ~34 observations into a fresh Protein).
# 2026-07-02 edge analysis (top-8 of 37 trials) pruned 9 reward-shaping coeffs that pinned at ~0
# across the whole frontier (see the [env] note) and widened the two ceiling-pinned levers: gamma up
# (top runs pinned the old 0.999999 max, the anchor itself sat above it) and clip_coef floor down
# (top runs pinned the old 0.01 min). Protein now searches the optimizer/PPO/arch levers that move
# score + the 5 live reward terms + score-safe curriculum/forecast depth. Safe because the
# depth-ramped SCORE is reward-coefficient-INDEPENDENT -- a bad coeff only slows training, it cannot
# inflate the score. DELIBERATELY EXCLUDED (change TASK DIFFICULTY, would let Protein game the score):
# scaffold cheats (prayer_oracle/bis_gear/invuln), loadout_profile_mode + beginner_loadout_fraction,
# remove_brews, episode_max_ticks_override, player_damage_received_scale + damage_scale_anneal,
# prayer_switch_fail_prob, obs/action-structure toggles (mask_*, step_out_forecast_obs_enabled,
# threat_field_obs_enabled).
# total_timesteps (compute horizon) is the dominant lever, swept JOINTLY with hidden_size/num_layers
# under the 1hr/trial cost cap.
# 2026-07-06 CL+slip co-adaptation sweep CONCLUDED 2026-07-07 (36 trials, group
# colosseum-clsweep-20260706, W&B valtterivalo-clock-cloud/puffer4): the entire score
# frontier pinned cl_frac/fresh_frac/slip at ~0 (best 0.5035 with CL fully off; the knee
# anchor drew 0.4685, in-band). CL does not earn its place, prayer axis stays closed --
# both pinned off in [train]/[env] above. NOTE: ran on the confounded env (forecast
# corner-cut lie, fixed 5239ddb72), so a decisive positive would have needed a re-run;
# a pinned-at-zero negative survives the confound.
# 2026-07-08 SOLVE sweep, CONCLUDED 2026-07-10 (31 trials, stopped to pivot to Sol-only
# training): BREAKOUT past the 0.30-0.40 plateau -- knee clear-brook-983 baked above, top
# scorer dainty-hill-985 recorded in the header. Frontier recipe: clip off the floor,
# curriculum fracs ON, wave_clear_bonus ~1-1.5, low death_penalty. hs2048 matched hs4096's
# score at ~1/5 the wall-clock; wins 0 everywhere; ent_coef pinned 1e-7 again; CL retrial
# (cl/fresh/num_start_states) stayed pinned at ~0 -- second strike, on the honest env.
# Ran with BARE late starts (pre-late_start_state_mode), so curriculum-frac pricing is the
# one suspect readout. Original design note kept below for the record.
# 2026-07-08 SOLVE sweep: the full-space search on the 2x env with an honest forecast,
# superseding the same-day narrow repricing launch (killed at 0 finished trials). After the
# fidelity pass + danger/positioning LoS obs the agent looks capable of surviving -- this
# sweep searches for the config directions that actually solve the event, not a single-axis
# answer. Space (34 dims):
#   compute: total_timesteps FREE (10M..2B) under max_suggestion_cost 7200s -- Protein's
#     cost model gates long trials, we do not pre-judge how many steps solving takes;
#   reward economy (the f9im4yp4 turtle response): the 5 live reward terms + farm_cap_waves
#     (4 = old hardcoded window, 12 = reinforcement damage never pays); death/timeout
#     ceilings 1.0 = the per-step PPO reward clamp, higher is silently truncated;
#   state-setting: classic curriculum tier fracs (waves 4/8/12, score-safe, frac 0 = off)
#     + best-trajectory CL (cl_frac/fresh_frac/num_start_states) back in -- the 07-07 CL
#     negative ran on the confounded corner-cut env, so it gets one honest retrial;
#   PPO/replay/optimizer: lr, gamma, gae_lambda, ent/clip/vf/vf_clip, grad norm, momentum,
#     min_lr_ratio, horizon, replay_ratio, minibatch, prio_alpha/beta0, vtrace clips;
#   arch: hidden_size (max raised 2048 -> 4096: the knee sat AT the old ceiling and scored
#     well = widen), num_layers, entity_encoder mode (1 = NPC pool, 2 = +inventory pool).
# DELIBERATELY EXCLUDED as before (task difficulty, would let Protein game the score):
# scaffold cheats, loadout profile knobs, remove_brews, episode_max_ticks_override,
# damage scale + anneal, prayer_switch_fail_prob (axis closed 07-06), obs/action toggles.
# NOTE sweep_only matches by SUBSTRING: "horizon" covers train.horizon + forecast_horizon,
# "clip_coef" covers clip_coef + vf_clip_coef, "curriculum_frac" covers all three tiers.
sweep_only = total_timesteps, damage_reward_coeff, boss_phase_bonus, win_bonus, death_penalty_coeff, timeout_penalty, argmax_gear_reward_coeff, offensive_boost_reward_coeff, vf_coef, vf_clip_coef
resume_from_log_dir = logs_sol_clampsweep

# FREE compute horizon: no prior on how many steps solving takes. The 7200s
# max_suggestion_cost is the real gate -- Protein's cost GP learns SPS per config and
# refuses suggestions it predicts over budget, so 2B is reachable only by configs fast
# enough to afford it. Random-phase samples stay near the anchor scale (scale = time).
[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 2_000_000_000
scale = time

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.9999999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = 0.5

# max 0.05 -> 0.010 (2026-07-16, clamp contract): coeff * damage must stay <= 1.0 on the
# heaviest single tick or the trainer clamp truncates it. Max realizable player tick ~= 95
# (guaranteed-max scythe 1.75x max_hit ~52 after a perfect parry, claws-spec burst similar,
# + thrall 3). 1/95 ~= 0.0105; 0.010 keeps the entire damage range proportional.
[sweep.env.damage_reward_coeff]
distribution = uniform
min = 0.0
max = 0.010
scale = auto

[sweep.env.wave_clear_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

# max 5.0 -> 1.0 (2026-07-16, clamp contract): see boss_phase_bonus.
[sweep.env.win_bonus]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 2.0
max = 12.0
scale = auto

[sweep.train.cl_frac]
distribution = uniform
min = 0.0
max = 0.20
scale = auto

[sweep.train.fresh_frac]
distribution = uniform
min = 0.0
max = 0.10
scale = auto

[sweep.train.num_start_states]
distribution = int_uniform
min = 8
max = 256
scale = auto

[sweep.env.prayer_switch_fail_prob]
distribution = uniform
min = 0.0
max = 0.15
scale = auto

# max 4096 -> 2048 (2026-07-13): hs4096 ran 1.9-5.4K SPS on the Sol-only task, three
# trials blew the 1200s cost cap ~10x (~6h burned) -- Protein's cost GP does not protect
# random-phase suggestions, and hs2048 matched hs4096's score at ~1/5 the wall-clock in
# the solve sweep. (History: 2048 -> 4096 widened 2026-07-08 off the bigsweep ceiling pin.)
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 2048
scale = auto

# max 4 -> 6 (2026-07-13): the Sol-sweep top-8 pinned the old ceiling 4 and scored well.
[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 8
scale = auto

# Shaping levers below tested rigorously and dropped 2026-07-02 (see [env] note). Commented, not
# deleted, so a future sweep does not re-add them without seeing they were tried and pinned at ~0.
# [sweep.env.stall_penalty_coeff]
# distribution = uniform
# min = 0.0
# max = 0.01
# scale = auto

# RE-ENABLED 2026-07-16 for a conscious retrial in the clamp sweep: the 2026-07-02 drop
# was priced on the OLD sim, the full-run task, and a clamp-corrupted damage scale --
# three regime changes since. Per-attack constants, clamp-safe at 0.05. Motivating
# observation (user watching fixsim2): tentacle over scythe (obs rank scythe 35% higher),
# no potting, hybrid armor -- the within-style heads erode when nothing prices them.
[sweep.env.argmax_gear_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.offensive_boost_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

# ---- optimizer / PPO hypers ----
[sweep.train.ent_coef]
distribution = log_normal
min = 0.0000001
max = 0.05
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.003
max = 0.3
scale = auto

# max 3.0 -> 5.0 (2026-07-16 mid-sweep, 16 trials): 2 of the clamp-sweep top-5 sat at
# exactly 3.0 = the ceiling; coupled with the vf_clip floor pin (tiny clip + big coef =
# strong clipped value steps), widen both edges in the same restart.
[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

# min 0.01 -> 0.003 (2026-07-13): the Sol-sweep top-8 pinned the old floor.
# min 0.003 -> 0.0005 (2026-07-16): the fair sweep pinned 0.003 = the new floor too, and
# vf_clip is priced in ABSOLUTE return units so the clamp-contract reward rescale changes
# what it should be -- reprice with the floor out of the way.
# min 0.0005 -> 0.0001 (2026-07-16 mid-sweep, 16 trials): clamp-sweep top-5 UNANIMOUS on
# the 0.0005 floor. Third consecutive floor pin across three ranges -- the preference is
# "essentially unclipped value updates"; give it one more decade of room.
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.0001
max = 1.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 5.0
scale = auto

