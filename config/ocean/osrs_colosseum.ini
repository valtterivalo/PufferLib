# Fortis Colosseum -- FOCUSED sweep (2026-06-25), on the lean per-category action space.
# Distilled from the 122-trial broad sweep (group colosseum-broadsweep-20260624): best
# wave ~6.0 / depth ~7.1 at only 50M steps. The broad sweep pinned total_timesteps at 50M
# (sweep_only gates every param via `k in name` at sweep.py:161, and nothing is a substring
# of total_timesteps) so the compute axis was never explored -- gamma showed zero edge for
# exactly that reason. This sweep frees the horizon and lets Protein choose it, governed by
# max_suggestion_cost as the wall-clock ceiling. Decided/inert dims are LOCKED to the broad
# sweep's winners; only the 8 live dims remain searchable.
#
# LOCKED winners baked into base below: ent_coef~0 (strongest edge, -98%), min_lr_ratio=0,
# cl_frac=0, clip_coef=0.015, vf_coef=0.5, hidden_size=512, num_layers=2, and the reward
# nulls (offpray/avoided/boss_damage/boss_phase all 0 -- all better at zero on clean data).

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score

[env]
start_wave = 1
damage_reward_coeff = 0.0235
boss_damage_reward_coeff = 0.0
wave_clear_bonus = 3.0
boss_phase_bonus = 0.0
win_bonus = 2.0
prayer_correct_reward = 0.0
offpray_damage_penalty_coeff = 0.0
multistyle_exposure_penalty_coeff = 0.0
avoided_damage_coeff = 0.0
death_penalty_coeff = 0.05
timeout_penalty = 0.10
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
forecast_horizon = 4
mask_inventory_heads = 0
prayer_oracle_mode = 0
bis_gear_oracle_mode = 0
invuln_mode = 0
episode_max_ticks_override = 0
remove_brews = 0
prayer_switch_fail_prob = 0.0
player_damage_received_scale = 1.0
damage_scale_anneal_start = 1.0
damage_scale_anneal_ticks = 0
mask_in_obs = 1.0
classic_curriculum_mode = 0
curriculum_num_tiers = 3
curriculum_wave_1 = 4
curriculum_frac_1 = 0.15
curriculum_wave_2 = 8
curriculum_frac_2 = 0.10
curriculum_wave_3 = 12
curriculum_frac_3 = 0.05

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 50000000
horizon = 16
min_lr_ratio = 0.0
learning_rate = 0.00104
momentum = 0.9641862728826048
eps = 0.000004655041309600953
ent_coef = 0.0000001
gamma = 0.99998
gae_lambda = 0.25
vtrace_rho_clip = 1.329703794225126
vtrace_c_clip = 2.660933625087891
prio_alpha = 0.0999082172361816
prio_beta0 = 0.290550947491407
state_buffer_size = 8192
cl_frac = 0.0
anneal_cl = 0
warmup_states = 1024
state_checkpoint_interval = 16
explore_alpha = 1.0
explore_beta = 0.0
explore_decay = 0.99
clip_coef = 0.015
vf_coef = 0.5
vf_clip_coef = 0.03
max_grad_norm = 4.0
replay_ratio = 8.0
minibatch_size = 4096

[sweep]
method = Protein
max_suggestion_cost = 1800
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
# 8 live dims. total_timesteps is now IN sweep_only (the fix) so Protein owns the horizon;
# max_suggestion_cost=1800s (30min wall) is the real ceiling -- at ~150K wall-SPS that lands
# the reachable horizon around 250-300M, so the declared 10M-300M range matches reality and
# the cost model governs which configs are feasible. gae_lambda widened DOWN (best hit the
# 0.25 floor) and replay_ratio widened UP (best hit the 8 ceiling). No substring collisions:
# the boss_damage_reward_coeff block is deleted so "damage_reward_coeff" can't drag it back.
sweep_only = total_timesteps, gamma, learning_rate, damage_reward_coeff, wave_clear_bonus, win_bonus, gae_lambda, replay_ratio
resume_from_log_dir =

[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 300_000_000
scale = time

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.99999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.003
scale = 0.5

[sweep.env.damage_reward_coeff]
distribution = uniform
min = 0.005
max = 0.05
scale = auto

[sweep.env.wave_clear_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.env.win_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.05
max = 0.95
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 2.0
max = 12.0
scale = auto
