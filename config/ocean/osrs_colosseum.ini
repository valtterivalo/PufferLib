# Fortis Colosseum. CURRENT SOTA baked as the train default 2026-06-29: easy-donkey-852
# (honest fair-fight wave 8.26 / depth ~11, no cheats; W&B group colosseum-fixsim-repro-20260627,
# run id d9i3bppz). Native NPC entity encoder ON, hidden_size 2048 / num_layers 3, ~249M steps,
# gamma 0.99999966, gae_lambda 0.01, lr 1.40e-3, replay_ratio 3.29. A plain
# `pufferl train osrs_colosseum` reproduces it. SOTA history + provenance: COLOSSEUM_SOTA.md.
#
# Superseded prior default: golden-eon-796 (wave 7.23, hs1024/L2, gamma 0.99999, 203M, 2026-06-25).
#
# The [sweep] section below is retained for future sweeps and does NOT affect a plain train run.
# It prices reward alignment + gear/obs levers on the corrected sim; sweep_only gates which params
# Protein searches. Lesson carried from the broad/focused sweeps: freeing total_timesteps (the
# compute horizon) is the dominant lever -- fixed-50M sweeps confounded gamma + architecture, so
# capacity (hidden_size/num_layers) and horizon are studied JOINTLY, never pinned.

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score

[env]
start_wave = 1
damage_reward_coeff = 0.03814269512693175
boss_damage_reward_coeff = 0.0
wave_clear_bonus = 2.682226380450244
boss_phase_bonus = 0.0
win_bonus = 1.7834144678933257
prayer_correct_reward = 0.0
offpray_damage_penalty_coeff = 0.0
multistyle_exposure_penalty_coeff = 0.0
argmax_gear_reward_coeff = 0.0
offensive_boost_reward_coeff = 0.0
stall_penalty_coeff = 0.0
dpt_obs_wielded_style = 0
avoided_damage_coeff = 0.0
death_penalty_coeff = 0.05
timeout_penalty = 0.1
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
forecast_horizon = 4
mask_inventory_heads = 0
prayer_oracle_mode = 0
bis_gear_oracle_mode = 0
invuln_mode = 0
episode_max_ticks_override = 0
remove_brews = 0
prayer_switch_fail_prob = 0.0
player_damage_received_scale = 1.0
damage_scale_anneal_start = 1.0
damage_scale_anneal_ticks = 0
mask_in_obs = 1.0
classic_curriculum_mode = 0
curriculum_num_tiers = 3
curriculum_wave_1 = 4
curriculum_frac_1 = 0.15
curriculum_wave_2 = 8
curriculum_frac_2 = 0.1
curriculum_wave_3 = 12
curriculum_frac_3 = 0.05

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32

[policy]
hidden_size = 2048
num_layers = 3
expansion_factor = 1
# 1 swaps the default Linear encoder for the NPC entity-pool encoder (global Linear
# + masked maxpool over a shared per-NPC MLP). 0 = byte-identical to the Linear baseline.
entity_encoder = 1

[train]
total_timesteps = 248894208
horizon = 16
min_lr_ratio = 0.0
learning_rate = 0.0014023389656327102
momentum = 0.9641862728826048
eps = 4.655041309600953e-06
ent_coef = 1e-07
gamma = 0.9999966368326824
gae_lambda = 0.010000000000000007
vtrace_rho_clip = 1.329703794225126
vtrace_c_clip = 2.660933625087891
prio_alpha = 0.0999082172361816
prio_beta0 = 0.290550947491407
state_buffer_size = 8192
cl_frac = 0.0
anneal_cl = 0
warmup_states = 1024
state_checkpoint_interval = 16
explore_alpha = 1.0
explore_beta = 0.0
explore_decay = 0.99
clip_coef = 0.015
vf_coef = 0.5
vf_clip_coef = 0.03
max_grad_norm = 4.0
replay_ratio = 3.2882396577404447
minibatch_size = 4096

[sweep]
method = Protein
max_suggestion_cost = 3600
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
# Corrected-sim sweep (post diagonal-melee / blood-fury / venator / corner-cut / kill-attribution
# fixes): prices reward ALIGNMENT + gear/obs levers. damage_reward_coeff floor dropped to 0 so
# Protein can turn dense damage reward off and lean on the depth score (the reinforcement-stall
# farm diagnosis); stall_penalty_coeff adds fast-clear pressure; argmax_gear/offensive_boost credit
# gearing; dpt_obs_wielded_style (0/1) toggles the per-cell DPT obs basis to the wielded style.
# entity_encoder forced on at launch (not swept). 1hr/trial cost cap governs depth (~250-350M at
# hs2048). FRESH cold-start: the config + sim changed, so prior observations don't transfer.
sweep_only = total_timesteps, gamma, learning_rate, damage_reward_coeff, wave_clear_bonus, win_bonus, gae_lambda, replay_ratio, hidden_size, num_layers, stall_penalty_coeff, argmax_gear_reward_coeff, offensive_boost_reward_coeff, dpt_obs_wielded_style
resume_from_log_dir =

[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 600_000_000
scale = time

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.999999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.003
scale = 0.5

[sweep.env.damage_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.wave_clear_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.env.win_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 2.0
max = 12.0
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 2048
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.env.stall_penalty_coeff]
distribution = uniform
min = 0.0
max = 0.01
scale = auto

[sweep.env.argmax_gear_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.offensive_boost_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.dpt_obs_wielded_style]
distribution = int_uniform
min = 0
max = 1
scale = auto
