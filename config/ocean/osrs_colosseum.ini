# Fortis Colosseum — scaffold config. Reward knobs default to 0 (sparse); the
# lead tunes them when wiring real combat and the boss.

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score

[env]
start_wave = 1
damage_reward_coeff = 0.0
boss_damage_reward_coeff = 0.0
wave_clear_bonus = 0.0
boss_phase_bonus = 0.0
win_bonus = 0.0
prayer_correct_reward = 0.0
death_penalty_coeff = 0.0
terminal_penalty_enabled = 0
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
mask_in_obs = 1.0
curriculum_wave_1 = 4
curriculum_frac_1 = 0.15
curriculum_wave_2 = 8
curriculum_frac_2 = 0.10
curriculum_wave_3 = 12
curriculum_frac_3 = 0.05

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 138326477
horizon = 16
min_lr_ratio = 0.000980071012242606
learning_rate = 0.0008596917323041326
momentum = 0.9641862728826048
eps = 0.000004655041309600953
ent_coef = 0.0000779653735730281
gamma = 0.9985
gae_lambda = 0.8103042852547117
vtrace_rho_clip = 1.329703794225126
vtrace_c_clip = 2.660933625087891
prio_alpha = 0.0999082172361816
prio_beta0 = 0.290550947491407
state_buffer_size = 0
cl_frac = 0.0
anneal_cl = 0
warmup_states = 0
state_checkpoint_interval = 16
explore_alpha = 0.0
explore_beta = 0.0
explore_decay = 0.99
clip_coef = 0.008335857515250372
vf_coef = 1.9655295251669234
vf_clip_coef = 0.03
max_grad_norm = 1.9495704455155376
replay_ratio = 4.0
minibatch_size = 4096

[sweep]
method = Protein
max_suggestion_cost = 4800
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
sweep_only = total_timesteps, learning_rate, ent_coef, gamma, gae_lambda

[sweep.train.total_timesteps]
distribution = log_normal
min = 50_000_000
max = 1_000_000_000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.004
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0000000001
max = 0.0002
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9975
max = 0.9999999999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.25
max = 0.999
scale = auto
