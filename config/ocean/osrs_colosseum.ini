# the farm-cap window (see [env] note): 4 = the old hardcoded waves-1-4 window,
# 12 = reinforcement fresh damage never pays anywhere. Floor at 4 because the
# skippable-window cap already earned its place in the 2026-07-05 A/B.
[sweep.env.farm_cap_waves]
distribution = int_uniform
min = 4
max = 12
scale = auto

# ---- score-safe curriculum + forecast depth ----
# Tier mass at waves 4/8/12 (see the [env] note: mode pinned 1, frac 0 = tier off, so
# these subsume the old binary classic_curriculum_mode dim). Each capped at 0.25 so the
# base wave-1 population never drops below 25% of envs -- the score is sampled only from
# base envs and needs the episode volume.
[sweep.env.curriculum_frac_1]
distribution = uniform
min = 0.0
max = 0.25
scale = auto

[sweep.env.curriculum_frac_2]
distribution = uniform
min = 0.0
max = 0.25
scale = auto

[sweep.env.curriculum_frac_3]
