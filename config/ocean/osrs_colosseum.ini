# Fortis Colosseum. Train default baked 2026-07-03: feasible-snowflake-933, the PARETO-KNEE pick
# from the bigsweep (W&B group colosseum-bigsweep-20260702, run id qt92v342): wave 7.65 / score
# 0.471 at 51K SPS in 154M steps. Chosen over the outright top scorer chocolate-pond-900 (wave
# 7.86 / 0.510 at 33.5K SPS, 250M) for ITERATION SPEED: 92% of the score at 1.5x the throughput
# and 60% of the steps; the score gap sits inside the measured anchor noise band (~0.08). Key
# shape: hs2048 / L2 / NPC entity encoder, replay_ratio 2.0, gae_lambda 0.46, clip 0.027,
# lr 7.1e-4, death_penalty 0. A plain `pufferl train osrs_colosseum` reproduces it.
# SOTA history + provenance: COLOSSEUM_SOTA.md.
#
# Superseded prior default: easy-donkey-852 (wave 8.26 on the PRE-DPT-DELETE obs (2565), an
# anchor-noise-band high draw; as the bigsweep anchor on the current 2393 obs it drew 7.50/6.63).
#
# The [sweep] section below is retained for future sweeps and does NOT affect a plain train run.
# It prices reward alignment + gear/obs levers on the corrected sim; sweep_only gates which params
# Protein searches. Lesson carried from the broad/focused sweeps: freeing total_timesteps (the
# compute horizon) is the dominant lever -- fixed-50M sweeps confounded gamma + architecture, so
# capacity (hidden_size/num_layers) and horizon are studied JOINTLY, never pinned.

[base]
env_name = osrs_colosseum
policy_name = MinGRU
rnn_name = Recurrent
score_metric = score
# Isolated from the shared logs/ dir (900+ old-group jsons) so sweep resume + writes stay clean.
# logs_clsweep = the 2026-07-06 CL+slip co-adaptation sweep; the banked logs_bigsweep
# observations are old-obs/no-CL and would poison this surrogate.
log_dir = logs_clsweep

[env]
start_wave = 1
damage_reward_coeff = 0.026527776190456404
wave_clear_bonus = 0.419299923259443
win_bonus = 3.3931809490646536
death_penalty_coeff = 0.0
timeout_penalty = 0.193650484973418
# reinforcement fresh damage pays no reward on waves 1-4 (the skippable window):
# the 2026-07-05 audit measured stall-farming at +3.3..+9.3 reward per overrun wave
# vs ~8.4 for the entire perfect-run event budget, with waves 2+ overrun on
# 92-100% of eval visits. Design decision, not swept (score is time-blind so a
# sweep cannot see farming).
farm_safe_damage_cap = 1
# All shaping below was swept comprehensively (group colosseum-bigsweep-20260701) and didn't earn
# its place: each pinned at ~0 across the entire score frontier. C struct defaults are 0.0f
# (encounter_colosseum_helpers.inc) so leaving them unset is behavior-identical. Re-enable one only
# with new evidence (uncomment here + add to sweep_only + its [sweep.env.*] block).
# boss_damage_reward_coeff = 0.0
# boss_phase_bonus = 0.0
# prayer_correct_reward = 0.0
# offpray_damage_penalty_coeff = 0.0
# multistyle_exposure_penalty_coeff = 0.0
# argmax_gear_reward_coeff = 0.0
# offensive_boost_reward_coeff = 0.0
# stall_penalty_coeff = 0.0
# avoided_damage_coeff = 0.0
loadout_profile_mode = 2
beginner_loadout_fraction = 0.5
step_out_forecast_obs_enabled = 1
threat_field_obs_enabled = 1
forecast_horizon = 4
mask_inventory_heads = 0
prayer_oracle_mode = 0
bis_gear_oracle_mode = 0
invuln_mode = 0
episode_max_ticks_override = 0
remove_brews = 0
prayer_switch_fail_prob = 0.0
player_damage_received_scale = 1.0
damage_scale_anneal_start = 1.0
damage_scale_anneal_ticks = 0
mask_in_obs = 1.0
classic_curriculum_mode = 0
curriculum_num_tiers = 3
curriculum_wave_1 = 4
curriculum_frac_1 = 0.15
curriculum_wave_2 = 8
curriculum_frac_2 = 0.1
curriculum_wave_3 = 12
curriculum_frac_3 = 0.05

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32

[policy]
hidden_size = 2048
num_layers = 2
expansion_factor = 1
# 1 swaps the default Linear encoder for the NPC entity-pool encoder (global Linear
# + masked maxpool over a shared per-NPC MLP). 0 = byte-identical to the Linear baseline.
entity_encoder = 1

[train]
total_timesteps = 153653162
horizon = 16
min_lr_ratio = 0.2023953462904992
learning_rate = 0.000712708131316004
momentum = 0.9986566800235904
eps = 4.655041309600953e-06
ent_coef = 1e-07
gamma = 0.9999872676749952
gae_lambda = 0.4642609004762156
vtrace_rho_clip = 2.206303692435914
vtrace_c_clip = 2.4828709522582604
prio_alpha = 0.3657109452063525
prio_beta0 = 0.1684179854370294
# Best-trajectory curriculum (upstream 5.0-simplecl port): CL/fresh envs restart
# from snapshots along per-slot best trajectories; vanilla envs alone feed logs.
# Default OFF (num_start_states 0). Host RAM = (num_start_states + cl+fresh envs)
# * state_trajectory_max_len * sizeof(ColosseumState) (~52KB) -- e.g. 64 slots +
# 15% of 8192 envs at max_len 128 is ~8.5GB. Episodes run ~1350-4000+ ticks, so
# checkpoint_interval * max_len must cover the episode (32 * 128 = 4096).
# Probe values: num_start_states 64, cl_frac 0.10, fresh_frac 0.05.
num_start_states = 0
cl_frac = 0.0
fresh_frac = 0.0
state_trajectory_max_len = 128
state_checkpoint_interval = 32
clip_coef = 0.02678589701604978
vf_coef = 0.9566983466731764
vf_clip_coef = 0.01
max_grad_norm = 2.6226987053702744
replay_ratio = 2.0
minibatch_size = 4096

[sweep]
method = Protein
max_suggestion_cost = 3600
max_runs = 400
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
metric = score
metric_distribution = linear
goal = maximize
# COMPREHENSIVE sweep on the corrected + DPT-deleted obs (2393), SEEDED from the running
# colosseum-bigsweep-20260701 (resume_from_log_dir replays its ~34 observations into a fresh Protein).
# 2026-07-02 edge analysis (top-8 of 37 trials) pruned 9 reward-shaping coeffs that pinned at ~0
# across the whole frontier (see the [env] note) and widened the two ceiling-pinned levers: gamma up
# (top runs pinned the old 0.999999 max, the anchor itself sat above it) and clip_coef floor down
# (top runs pinned the old 0.01 min). Protein now searches the optimizer/PPO/arch levers that move
# score + the 5 live reward terms + score-safe curriculum/forecast depth. Safe because the
# depth-ramped SCORE is reward-coefficient-INDEPENDENT -- a bad coeff only slows training, it cannot
# inflate the score. DELIBERATELY EXCLUDED (change TASK DIFFICULTY, would let Protein game the score):
# scaffold cheats (prayer_oracle/bis_gear/invuln), loadout_profile_mode + beginner_loadout_fraction,
# remove_brews, episode_max_ticks_override, player_damage_received_scale + damage_scale_anneal,
# prayer_switch_fail_prob, obs/action-structure toggles (mask_*, step_out_forecast_obs_enabled,
# threat_field_obs_enabled).
# total_timesteps (compute horizon) is the dominant lever, swept JOINTLY with hidden_size/num_layers
# under the 1hr/trial cost cap.
# 2026-07-06 CL+slip co-adaptation sweep: core learning-dynamics hypers + the ported
# best-trajectory CL knobs + prayer slip. Anchor (trial 0) = this ini = knee config with
# CL off and slip 0, so the baseline is in-sweep. cl_frac/fresh_frac min 0 lets Protein
# express "no CL"; slip carries the on-env scoreboard tax, so nonzero-on-the-front is a
# strong positive, pinned-at-0 is expected-negative. Bigsweep space preserved in git.
sweep_only = total_timesteps, gamma, learning_rate, gae_lambda, replay_ratio, ent_coef, clip_coef, cl_frac, fresh_frac, num_start_states, prayer_switch_fail_prob
resume_from_log_dir = logs_clsweep

[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 600_000_000
scale = time

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.9999999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.003
scale = 0.5

[sweep.env.damage_reward_coeff]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.wave_clear_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.env.win_bonus]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.95
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 2.0
max = 12.0
scale = auto

[sweep.train.cl_frac]
distribution = uniform
min = 0.0
max = 0.20
scale = auto

[sweep.train.fresh_frac]
distribution = uniform
min = 0.0
max = 0.10
scale = auto

[sweep.train.num_start_states]
distribution = int_uniform
min = 8
max = 256
scale = auto

[sweep.env.prayer_switch_fail_prob]
distribution = uniform
min = 0.0
max = 0.15
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 2048
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

# Shaping levers below tested rigorously and dropped 2026-07-02 (see [env] note). Commented, not
# deleted, so a future sweep does not re-add them without seeing they were tried and pinned at ~0.
