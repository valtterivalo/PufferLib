[base]
env_name = osrs_zulrah
score_metric = score
log_dir = logs_zulrah_sweep_20260521
checkpoint_dir = checkpoints_zulrah_sweep_20260521
checkpoint_interval = 0
eval_episodes = 4096

[env]
gear_tier = 2

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 20_000_000
horizon = 64
minibatch_size = 8192
learning_rate = 0.003
gamma = 0.995
gae_lambda = 0.90
ent_coef = 0.001
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
replay_ratio = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 300
max_runs = 120
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.30
sweep_only = train.total_timesteps, train.horizon, train.learning_rate, train.ent_coef, train.gamma, train.gae_lambda, train.clip_coef, train.vf_coef, train.vf_clip_coef, train.max_grad_norm, train.replay_ratio, train.vtrace_rho_clip, train.vtrace_c_clip, train.prio_alpha, train.prio_beta0, vec.total_agents, policy.hidden_size, policy.num_layers

[sweep.train.total_timesteps]
distribution = log_normal
min = 5_000_000
max = 120_000_000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0004
max = 0.02
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00000001
max = 0.02
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.50
max = 0.999
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.08
max = 0.35
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.5
max = 4.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.85
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.0001
max = 0.95
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 3
scale = auto
