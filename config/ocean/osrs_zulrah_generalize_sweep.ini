[base]
env_name = osrs_zulrah
score_metric = score_general
log_dir = logs_zulrah_generalize_20260521
checkpoint_dir = checkpoints_zulrah_generalize_20260521
checkpoint_interval = 0
eval_episodes = 4096

[env]
gear_tier = 0
gear_tier_mode = 2
gear_tier_weight_0 = 0.50
gear_tier_weight_1 = 0.30
gear_tier_weight_2 = 0.20

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 25_000_000
learning_rate = 0.005
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.9985
gae_lambda = 0.94
replay_ratio = 1.8
clip_coef = 0.25
vf_coef = 3.0
vf_clip_coef = 0.22
max_grad_norm = 2.0
ent_coef = 0.0002
parent_kl_coef = 0.0
parent_kl_log = 0
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
aurora = 0
overlap = 0
cpu_inference = 0
train_fp16 = 0
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.3
vtrace_c_clip = 1.35
prio_alpha = 0.85
prio_beta0 = 0.30
state_curriculum_mode = 0
state_buffer_size = 0
cl_frac = 0.0
warmup_states = 0
explore_alpha = 0.8
explore_beta = 0.2
terminal_reset_state = 1

[sweep]
method = Protein
metric = score_general
metric_distribution = linear
goal = maximize
max_suggestion_cost = 300
max_runs = 160
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
sweep_only = train.total_timesteps, train.horizon, train.learning_rate, train.ent_coef, train.gamma, train.gae_lambda, train.clip_coef, train.vf_coef, train.vf_clip_coef, train.max_grad_norm, train.replay_ratio, train.vtrace_rho_clip, train.vtrace_c_clip, train.prio_alpha, train.prio_beta0, vec.total_agents, policy.hidden_size, policy.num_layers

[sweep.train.total_timesteps]
distribution = log_normal
min = 8_000_000
max = 80_000_000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0015
max = 0.012
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0000001
max = 0.005
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.990
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.80
max = 0.995
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.12
max = 0.35
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.8
max = 4.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.08
max = 0.45
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.5
max = 4.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 3.0
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.8
max = 2.2
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.8
max = 2.2
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.85
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.0001
max = 0.95
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 8192
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 3
scale = auto
