<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Inferno benchmark contract</title>
  <desc id="desc">A schematic showing how the Inferno simulator connects symbolic observations, structured actions, strict masks, logs, replay, and PufferLib training.</desc>
  <rect width="1200" height="720" fill="#f7f7f4"/>
  <text x="600" y="58" text-anchor="middle" font-family="Helvetica" font-size="34" font-weight="700" fill="#1f2933">Inferno Benchmark Contract</text>
  <text x="600" y="93" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#4b5563">The same game facts drive training, replay, masks, and failure logs.</text>

  <rect x="60" y="150" width="300" height="170" rx="10" fill="#ffffff" stroke="#2f5d62" stroke-width="3"/>
  <text x="210" y="190" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">OSRS Inferno Sim</text>
  <text x="90" y="230" font-family="Helvetica" font-size="17" fill="#374151">69 waves, pillars, Zuk shield</text>
  <text x="90" y="260" font-family="Helvetica" font-size="17" fill="#374151">Prayer, supplies, target priority</text>
  <text x="90" y="290" font-family="Helvetica" font-size="17" fill="#374151">One step = one 0.6s tick</text>

  <rect x="450" y="130" width="300" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="600" y="171" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">Observation</text>
  <text x="600" y="205" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#374151">744 player-readable features</text>

  <rect x="450" y="280" width="300" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="600" y="321" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">Action Interface</text>
  <text x="600" y="355" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#374151">9 heads, 89 strict mask logits</text>

  <rect x="450" y="430" width="300" height="110" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="471" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">Replay And Logs</text>
  <text x="600" y="505" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#374151">Win, wave, prayer, healers, Zuk HP</text>

  <rect x="840" y="150" width="300" height="170" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="990" y="190" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">PufferLib 4</text>
  <text x="870" y="230" font-family="Helvetica" font-size="17" fill="#374151">4096 parallel agents</text>
  <text x="870" y="260" font-family="Helvetica" font-size="17" fill="#374151">PufferNet, MinGRU, CUDA kernels</text>
  <text x="870" y="290" font-family="Helvetica" font-size="17" fill="#374151">Protein sweeps over score and cost</text>

  <rect x="840" y="420" width="300" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="990" y="461" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#1f2933">Human Inspection</text>
  <text x="870" y="500" font-family="Helvetica" font-size="17" fill="#374151">Renderer and replay expose mistakes</text>
  <text x="870" y="530" font-family="Helvetica" font-size="17" fill="#374151">Policy failures stay player-readable</text>

  <path d="M360 205 H450" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 185 H840" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M840 275 H750" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M450 335 H360" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 290 C410 430 420 485 450 485" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 485 H840" stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="130" y="575" width="940" height="70" rx="10" fill="#e7f0ee" stroke="#2f5d62" stroke-width="2"/>
  <text x="600" y="618" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#1f2933">If watched behavior looks wrong, the simulator, masks, replay, and logs must explain why.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
</svg>

