# Reference fragment shared by all stage R1 reward sweeps. Not meant to be
# loaded directly — each variant .ini repeats these blocks (configparser
# does not support includes). Edits here document the intended common
# values; sync any change across the four variant files.
#
# The four variant files are:
#   inferno_reward_current_widened.ini  control: current reward, widened hparams
#   inferno_reward_v1_progress.ini      bounded progress-delta only
#   inferno_reward_v2_milestones.ini    v1 + phase HP milestones
#   inferno_reward_v3_rebalanced.ini    rebalanced current
#
# Each variant differs only in the [env] reward shaping knobs:
#   damage_reward_coeff, shield_penalty_coeff, tag_reward_coeff,
#   win_bonus_coeff, death_penalty_coeff,
#   phase_900_bonus, phase_600_bonus, phase_300_bonus,
#   shield_penalty_episode_cap.
#
# Sweep ranges are identical across variants (the "widened" set per the
# heavy research agent's v4 brief).
