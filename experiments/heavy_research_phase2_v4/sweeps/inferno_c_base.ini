# Stage C base config: v3 reward, e3vyhuh9 hparams as starting point.
# Three arms differ only in phase2 settings, which get overridden via CLI:
#   C0: phase2_demo_dir = ""  (PPO continuation control)
#   C1: phase2_demo_dir = "<path>", phase2_bc_coef = 0  (curriculum only)
#   C2: phase2_demo_dir = "<path>", phase2_bc_coef = 0.003 etc (curriculum + BC)
#
# Proposal: checkpoints/osrs_inferno/v3xzk1qs/0000000199983104.bin (P0).
# Hparams: e3vyhuh9 (from R1 v3 sweep), as confirmed by aprime_hparams.json.

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = zuk_objective_normal

[env]
start_wave = 69
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.002
tag_reward_coeff = 0.10
win_bonus_coeff = 8.0
death_penalty_coeff = 1.0
phase_900_bonus = 0.0
phase_600_bonus = 0.0
phase_300_bonus = 0.0
shield_penalty_episode_cap = 0.5
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
record_best_replay_path = ""
play_replay_path = ""
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

phase2_demo_dir = ""
phase2_num_atns = 9
phase2_snapshot_stride = 2
phase2_max_demos = 64
phase2_seed = 42
phase2_normal_start_frac = 0.75
phase2_randomize_rng_frac = 0.00
phase2_bc_coef = 0.0
phase2_bc_demos_per_minibatch = 0
phase2_promote_rate = 0.25
phase2_demote_rate = 0.10
phase2_backstep_ticks = 2
phase2_success_q_delta = 0.005

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 50000000
horizon = 128
minibatch_size = 4096

learning_rate = 0.0091954
min_lr_ratio = 0.226254
beta1 = 0.963
beta2 = 0.99987
eps = 0.000002
ent_coef = 0.00154412
gamma = 0.99974
gae_lambda = 0.89284
vtrace_rho_clip = 4.46444
vtrace_c_clip = 2.01167
prio_alpha = 0.023369
prio_beta0 = 0.11
clip_coef = 0.0659328
vf_coef = 0.5
vf_clip_coef = 0.1
max_grad_norm = 2.47366
replay_ratio = 0.893914
