# Reward-v4 healer-transition Protein sweep.
#
# Optimizes the first observed restored-start bottleneck: tagging at least one
# Zuk healer. Healer kills, all-healers-dead, post-150 progress, score, and SPS
# are analysis gates, not the Protein target.

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = frac_zuk_healers_tagged_ge_1_snapshot

[env]
start_wave = 69
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.002
tag_reward_coeff = 0.20
win_bonus_coeff = 8.0
death_penalty_coeff = 1.0
phase_900_bonus = 0.0
phase_600_bonus = 0.0
phase_300_bonus = 0.0
shield_penalty_episode_cap = 0.5
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
record_best_replay_path = ""
play_replay_path = ""
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

jad_damage_reward_coeff = 0.0
zuk_healer_damage_reward_coeff = 0.0
set_damage_reward_coeff = 0.0
jad_kill_bonus = 0.0
zuk_healer_kill_bonus = 0.0
set_kill_bonus = 0.0
post_jad_zuk_multiplier = 1.0
jad_alive_zuk_multiplier = 1.0

phase2_demo_dir = ""
phase2_num_atns = 9
phase2_snapshot_stride = 2
phase2_max_demos = 64
phase2_seed = 42
phase2_normal_start_frac = 0.45
phase2_randomize_rng_frac = 0.04
phase2_diagnostic_phase = 0
phase2_diagnostic_tries = 512
phase2_max_player_attack_timer = -1
phase2_bc_coef = 0.0
phase2_bc_demos_per_minibatch = 0
phase2_promote_rate = 0.25
phase2_demote_rate = 0.10
phase2_backstep_ticks = 8
phase2_success_q_delta = 0.0010560670538554925

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 50000000
horizon = 128
minibatch_size = 4096
learning_rate = 0.0008836829619964984
min_lr_ratio = 0.6733178808180771
beta1 = 0.963
beta2 = 0.99987
eps = 0.000002
ent_coef = 0.016636828336430237
gamma = 0.999997223455653
gae_lambda = 0.92
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.12916827796176567
prio_beta0 = 0.11
clip_coef = 0.0680595985698656
vf_coef = 0.5
vf_clip_coef = 1.9766612069408152
max_grad_norm = 0.581115937809795
replay_ratio = 0.30461446981116713
terminal_reset_state = 1

[sweep]
method = Protein
goal = maximize
metric = frac_zuk_healers_tagged_ge_1_snapshot
metric_distribution = linear
min_sps = 100000
max_suggestion_cost = 720
max_runs = 32
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = learning_rate, ent_coef, gamma, gae_lambda, min_lr_ratio, clip_coef, vf_coef, vf_clip_coef, max_grad_norm, replay_ratio, prio_alpha, tag_reward_coeff, damage_reward_coeff, shield_penalty_coeff, shield_penalty_episode_cap, jad_damage_reward_coeff, zuk_healer_damage_reward_coeff, set_damage_reward_coeff, jad_kill_bonus, zuk_healer_kill_bonus, set_kill_bonus, post_jad_zuk_multiplier, jad_alive_zuk_multiplier, phase2_normal_start_frac, phase2_randomize_rng_frac, phase2_backstep_ticks, phase2_success_q_delta

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.004
max = 0.050
scale = auto

[sweep.train.gamma]
