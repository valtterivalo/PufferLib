# Stage R1 reward variant v1: bounded progress-delta only.
# damage_reward_coeff already operates on best-so-far Zuk HP at start_wave=69
# (the only wave we sweep over). v1 strips tag/shield shaping and adds
# explicit terminal bonuses. Total Zuk progress = 0.00833 * 1200 = 10.0.
# Use with:
#   PUFFER_CONFIG_FILE=experiments/heavy_research_phase2_v4/sweeps/inferno_reward_v1_progress.ini \
#     python -m pufferlib.pufferl sweep osrs_inferno --wandb \
#     --tag stage-r1-v1-progress \
#     --load-model-path checkpoints/osrs_inferno/cdevk9pk/0000000029982720.bin

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = zuk_objective_normal

[env]
start_wave = 69
damage_reward_coeff = 0.00833
shield_penalty_coeff = 0.0
tag_reward_coeff = 0.0
win_bonus_coeff = 5.0
death_penalty_coeff = 1.0
phase_900_bonus = 0.0
phase_600_bonus = 0.0
phase_300_bonus = 0.0
shield_penalty_episode_cap = 0.0
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
record_best_replay_path = ""
play_replay_path = ""
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

phase2_demo_dir = ""
phase2_num_atns = 9
phase2_snapshot_stride = 4
phase2_max_demos = 64
phase2_seed = 42
phase2_normal_start_frac = 0.25
phase2_randomize_rng_frac = 0.25
phase2_bc_coef = 0.0
phase2_bc_demos_per_minibatch = 0
phase2_promote_rate = 0.30
phase2_demote_rate = 0.10
phase2_backstep_ticks = 4
phase2_success_q_delta = 0.005

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 50000000
horizon = 128
minibatch_size = 4096

learning_rate = 0.005
min_lr_ratio = 0.5
beta1 = 0.963
beta2 = 0.99987
eps = 0.000002
ent_coef = 0.01
gamma = 0.99999
gae_lambda = 0.85
vtrace_rho_clip = 2.5
vtrace_c_clip = 1.5
prio_alpha = 0.03
prio_beta0 = 0.11
clip_coef = 0.05
vf_coef = 0.15
vf_clip_coef = 1.0
max_grad_norm = 1.0
replay_ratio = 0.7

[sweep]
method = Protein
goal = maximize
min_sps = 100000
max_suggestion_cost = 720
max_runs = 60
gpus = 1
metric = zuk_objective_normal
metric_distribution = linear
sweep_only = learning_rate, ent_coef, gamma, gae_lambda, min_lr_ratio, clip_coef, vf_coef, vf_clip_coef, max_grad_norm, replay_ratio, prio_alpha, vtrace_rho_clip, vtrace_c_clip
prune_pareto = true
early_stop_quantile = 0.3
downsample = 5

[sweep.train.learning_rate]
distribution = log_normal
min = 0.002
max = 0.020
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.080
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9995
max = 0.999999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.70
max = 0.95
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.20
max = 1.00
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 0.20
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.03
max = 0.50
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.10
max = 2.00
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.30
max = 3.00
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 1.50
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.0
max = 0.20
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 3.0
scale = auto
