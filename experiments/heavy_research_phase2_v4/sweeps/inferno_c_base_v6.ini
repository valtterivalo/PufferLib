# v6-soft-E base config (heavy agent r5 + transition multiplier).
# Inherits from inferno_c_base.ini; adds v6 add-damage rewards, kill bonuses,
# and optional post_jad_zuk_multiplier.
#
# Per-arm overrides via CLI:
#   v3 control:        all v6_* and *_zuk_multiplier coeffs at 0 / 1.0
#   v6 soft-E pure:    set v6 coeffs, leave multipliers at 1.0
#   v6 +transition:    above + post_jad_zuk_multiplier > 1.0
#
# Proposal: checkpoints/osrs_inferno/p2k4szzs/0000000049971200.bin (round-2 best).

[base]
env_name = osrs_inferno
policy_name = MinGRU
rnn_name = Recurrent
score_metric = zuk_objective_normal

[env]
start_wave = 69
damage_reward_coeff = 0.01
shield_penalty_coeff = 0.002
tag_reward_coeff = 0.10
win_bonus_coeff = 8.0
death_penalty_coeff = 1.0
phase_900_bonus = 0.0
phase_600_bonus = 0.0
phase_300_bonus = 0.0
shield_penalty_episode_cap = 0.5
late_start_supply_profile_scale = 1.0
mask_in_obs = 1.0
record_best_replay_path = ""
play_replay_path = ""
curriculum_wave_1 = 20.0
curriculum_frac_1 = 0.0
curriculum_wave_2 = 40.0
curriculum_frac_2 = 0.0
curriculum_wave_3 = 60.0
curriculum_frac_3 = 0.0

# v6-soft-E reward defaults (off). Per-arm CLI sets these.
jad_damage_reward_coeff = 0.0
zuk_healer_damage_reward_coeff = 0.0
set_damage_reward_coeff = 0.0
jad_kill_bonus = 0.0
zuk_healer_kill_bonus = 0.0
set_kill_bonus = 0.0
post_jad_zuk_multiplier = 1.0
jad_alive_zuk_multiplier = 1.0

phase2_demo_dir = ""
phase2_num_atns = 9
phase2_snapshot_stride = 2
phase2_max_demos = 64
phase2_seed = 42
phase2_normal_start_frac = 0.65
phase2_randomize_rng_frac = 0.00
phase2_bc_coef = 0.0
phase2_bc_demos_per_minibatch = 0
phase2_promote_rate = 0.25
phase2_demote_rate = 0.10
phase2_backstep_ticks = 2
phase2_success_q_delta = 0.005

[vec]
total_agents = 256
num_buffers = 2
num_threads = 16

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 50000000
horizon = 128
minibatch_size = 4096

learning_rate = 0.0091954
min_lr_ratio = 0.226254
beta1 = 0.963
beta2 = 0.99987
eps = 0.000002
ent_coef = 0.00154412
gamma = 0.99974
gae_lambda = 0.89284
vtrace_rho_clip = 4.46444
vtrace_c_clip = 2.01167
prio_alpha = 0.023369
prio_beta0 = 0.11
clip_coef = 0.0659328
vf_coef = 0.5
vf_clip_coef = 0.1
max_grad_norm = 2.47366
replay_ratio = 0.893914
